<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tempo Signal — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --red:#D71920; --red-deep:#A8121A; --red-tint:#FCEBEC;
  --ink:#1A1A1A; --ink-2:#444; --muted:#737373; --faint:#9A9A9A;
  --paper:#FFFFFF; --canvas:#F5F5F3; --rule:#E2E2DF; --rule-2:#EEEEEC;
  --side:#161616; --side-2:#232323; --side-ink:#D9D9D9; --side-muted:#8C8C8C;
  --ev-verified:#1E7B4A; --ev-verified-bg:#E7F4EC;
  --ev-reported:#1F4E8C; --ev-reported-bg:#E8EFF8;
  --ev-unverified:#9A5B00; --ev-unverified-bg:#FDF2E1;
  --ev-sentiment:#6D3B92; --ev-sentiment-bg:#F2EAF7;
  --ev-ai:#444; --ev-ai-bg:transparent;
  --news:#1F4E8C; --social:#D71920;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --red:#F0454B; --red-deep:#FF6B70; --red-tint:#3A1A1B;
    --ink:#F0F0EE; --ink-2:#C9C9C6; --muted:#9B9B98; --faint:#77777A;
    --paper:#1D1D1D; --canvas:#141414; --rule:#333; --rule-2:#2A2A2A;
    --side:#0E0E0E; --side-2:#1E1E1E;
    --ev-verified:#5CC08A; --ev-verified-bg:#173022;
    --ev-reported:#7FA8E3; --ev-reported-bg:#18263A;
    --ev-unverified:#E8A94A; --ev-unverified-bg:#33260F;
    --ev-sentiment:#C69BE6; --ev-sentiment-bg:#2B1F36;
    --ev-ai:#C9C9C6; --news:#7FA8E3; --social:#F0454B;
  }
}
:root[data-theme="dark"]{
  --red:#F0454B; --red-deep:#FF6B70; --red-tint:#3A1A1B;
  --ink:#F0F0EE; --ink-2:#C9C9C6; --muted:#9B9B98; --faint:#77777A;
  --paper:#1D1D1D; --canvas:#141414; --rule:#333; --rule-2:#2A2A2A;
  --side:#0E0E0E; --side-2:#1E1E1E;
  --ev-verified:#5CC08A; --ev-verified-bg:#173022;
  --ev-reported:#7FA8E3; --ev-reported-bg:#18263A;
  --ev-unverified:#E8A94A; --ev-unverified-bg:#33260F;
  --ev-sentiment:#C69BE6; --ev-sentiment-bg:#2B1F36;
  --ev-ai:#C9C9C6; --news:#7FA8E3; --social:#F0454B;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--canvas);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
img,svg{max-width:100%}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;height:100%}
.side{background:var(--paper);color:var(--ink-2);display:flex;flex-direction:column;overflow-y:auto;border-right:1px solid var(--rule)}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px;border-bottom:1px solid var(--rule-2)}
.brand-mark{background:var(--red);color:#fff;font:700 15px/1 var(--serif);letter-spacing:.02em;padding:7px 8px 6px}
.brand-name{font:600 17px/1 var(--serif);color:var(--ink)}
.brand-sub{display:block;font:500 11px/1.3 var(--sans);color:var(--muted);margin-top:4px}
.nav{padding:8px 10px 16px;flex:1}
.nav-group{margin-top:6px;padding-top:10px}
.nav-group+.nav-group{border-top:1px solid var(--rule-2)}
.nav-group:first-child{margin-top:0;padding-top:4px}
.nav-group.util{margin-top:14px}
.nav-head{display:flex;align-items:center;gap:9px;padding:4px 12px 6px;cursor:default}
.nav-num{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--red);color:var(--red);display:grid;place-items:center;font:700 11px/1 var(--sans);flex:none}
.nav-title{display:block;font:700 11.5px/1.2 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--ink)}
.nav-head small{display:block;font:400 11.5px/1.3 var(--sans);color:var(--muted);margin-top:1px;letter-spacing:0;text-transform:none}
.nav-group.util .nav-title{color:var(--muted)}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:8px 12px 8px 41px;border:0;background:none;color:var(--ink-2);border-radius:4px;text-align:left;font-size:14px;position:relative;margin:1px 0}
.nav-group:first-child .nav-item,.nav-group.util .nav-item{padding-left:12px}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.75}
.nav-item:hover{background:var(--canvas);color:var(--ink)}
.nav-item.on{background:var(--red-tint);color:var(--ink);font-weight:600}
.nav-item.on svg{color:var(--red);opacity:1}
.nav-item.on::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;background:var(--red)}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 7px}
.side-foot{padding:14px 20px;border-top:1px solid var(--rule-2);font-size:12px;color:var(--muted)}
.side-foot .who{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:13px;margin-bottom:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:#3a3a3a;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.side-foot .avatar{background:var(--ink);color:var(--paper)}
.demo-flag{display:flex;gap:8px;align-items:flex-start;line-height:1.4}
.demo-flag i{width:8px;height:8px;border-radius:50%;background:#E8A94A;margin-top:4px;flex:none}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:14px;padding:12px 28px;background:var(--paper);border-bottom:1px solid var(--rule);flex:none}
.top .crumb{font-size:13px;color:var(--muted)}
.top .crumb b{color:var(--ink);font-weight:600}
.top .spacer{flex:1}
.gsearch{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);border-radius:4px;padding:6px 10px;width:300px;background:var(--canvas);color:var(--muted);font-size:13px}
.gsearch input{border:0;background:none;outline:none;width:100%;color:var(--ink)}
.iconbtn{border:1px solid var(--rule);background:var(--paper);border-radius:4px;width:34px;height:34px;display:grid;place-items:center;position:relative}
.iconbtn svg{width:17px;height:17px}
.iconbtn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.menu-btn{display:none}
.content{flex:1;overflow-y:auto;padding:28px 28px 64px}
.wrap{max-width:1180px;margin:0 auto}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:600;letter-spacing:-.005em}
h1{font-size:30px;line-height:1.15}
h2{font-size:21px;line-height:1.25}
h3{font-size:17px;line-height:1.3}
.lede{color:var(--ink-2);margin:6px 0 0;max-width:68ch}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.page-head{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap}
.layer-tag{font-size:12px;color:var(--red);font-weight:600;margin-bottom:6px}

/* ---------- surfaces ---------- */
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:6px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--rule-2)}
.panel-b{padding:16px 18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g-main{grid-template-columns:minmax(0,1fr) 340px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
hr.rule{border:0;border-top:1px solid var(--rule-2);margin:14px 0}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--paper);padding:7px 13px;border-radius:4px;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--canvas)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkish{background:none;border:0;padding:0;color:var(--red);font-weight:600;font-size:13px}
.linkish:hover{text-decoration:underline}
.input,.select,textarea.input{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:9px 11px;font-size:14px}
.input:focus,.select:focus{outline:2px solid var(--red);outline-offset:-1px;border-color:transparent}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.field{margin-bottom:14px}
.help{font-size:12px;color:var(--muted);margin-top:5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:18px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--red);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:6px 12px;font-size:13px;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--paper)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:12px;background:var(--paper)}
button.chip:hover{border-color:var(--ink-2)}
.chip.k{background:var(--canvas)}
.chip.x{text-decoration:line-through;color:var(--muted)}
.check{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border:1px solid var(--rule);border-radius:4px;cursor:pointer;background:var(--paper)}
.check input{margin-top:3px;accent-color:var(--red)}
.check.on{border-color:var(--ink)}

/* ---------- evidence system (the signature) ---------- */
.ev{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px 2px 7px;border-radius:3px;white-space:nowrap;line-height:1.5;vertical-align:1px}
.ev::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ev.verified{color:var(--ev-verified);background:var(--ev-verified-bg)}
.ev.reported{color:var(--ev-reported);background:var(--ev-reported-bg)}
.ev.unverified{color:var(--ev-unverified);background:var(--ev-unverified-bg)}
.ev.sentiment{color:var(--ev-sentiment);background:var(--ev-sentiment-bg)}
.ev.ai{color:var(--ev-ai);border:1px dashed currentColor;padding:1px 7px 1px 6px}
.ev.ai::before{background:none;border:1px solid currentColor;width:5px;height:5px}
.ev.none{color:var(--muted);background:var(--canvas)}
.claim{border-left:3px solid var(--rule);padding:2px 0 2px 12px;margin:10px 0}
.claim.reported{border-color:var(--ev-reported)}
.claim.verified{border-color:var(--ev-verified)}
.claim.unverified{border-color:var(--ev-unverified)}
.claim.sentiment{border-color:var(--ev-sentiment)}
.claim.ai{border-left-style:dashed;border-color:var(--ink-2)}
.cite{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 4px;font-size:11px;font-weight:700;border-radius:3px;border:1px solid var(--rule);background:var(--canvas);color:var(--ink);vertical-align:2px;margin-left:2px;cursor:pointer}
.cite:hover{border-color:var(--red);color:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:12px;color:var(--muted)}
.coverage{display:flex;gap:10px;align-items:flex-start;background:var(--canvas);border:1px solid var(--rule-2);border-radius:4px;padding:10px 12px;font-size:13px;color:var(--ink-2)}
.coverage svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--muted)}
.coverage.warn{background:var(--ev-unverified-bg);border-color:transparent}
.coverage.warn svg{color:var(--ev-unverified)}

/* ---------- lists & cards ---------- */
.list>li{list-style:none}
.list{margin:0;padding:0}
.item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule-2)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item h4{margin:0 0 3px;font:600 15px/1.35 var(--sans)}
.clickrow{cursor:pointer;border-radius:4px}
.clickrow:hover h4{color:var(--red)}
.trend-row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--rule-2);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.trend-row:last-child{border-bottom:0}
.trend-row:hover .t{color:var(--red)}
.rank{font:600 15px/1 var(--serif);color:var(--faint)}
.delta{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.up{color:var(--red)} .down{color:var(--ev-verified)} .flat{color:var(--muted)}
.spark{display:block}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.mini-stat{padding:14px 16px;border-right:1px solid var(--rule-2)}
.mini-stat:last-child{border-right:0}
.mini-stat .n{font:600 26px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.mini-stat .l{font-size:12px;color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--rule)}
table.t td{padding:10px;border-bottom:1px solid var(--rule-2);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}

/* ---------- hero ---------- */
.hero{background:var(--paper);border:1px solid var(--rule);border-top:4px solid var(--red);border-radius:6px;padding:26px 28px 22px;margin-bottom:22px}
.hero h1{font-size:34px}
.date-line{font-size:13px;color:var(--muted);margin-bottom:8px}
.askbox{display:flex;align-items:center;gap:10px;margin-top:18px;border:1.5px solid var(--ink);border-radius:6px;padding:6px 6px 6px 14px;background:var(--paper)}
.askbox svg{width:19px;height:19px;color:var(--muted);flex:none}
.askbox input{flex:1;border:0;outline:none;background:none;font-size:16px;padding:8px 0;min-width:0}
.prompts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- ask ---------- */
.chat{max-width:780px}
.msg-q{display:flex;justify-content:flex-end;margin:18px 0}
.msg-q span{background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:12px 12px 2px 12px;max-width:80%}
.answer{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px 20px}
.answer p{margin:0 0 10px;max-width:72ch}
.ans-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.ans-head .tempo-dot{width:22px;height:22px;background:var(--red);color:#fff;display:grid;place-items:center;font:700 12px/1 var(--serif)}
.source-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:12px}
.src-card{border:1px solid var(--rule);border-radius:4px;padding:9px 11px;background:var(--canvas);text-align:left;font-size:13px;line-height:1.35}
.src-card:hover{border-color:var(--ink-2)}
.src-card b{display:block;font-weight:600;margin:2px 0}
.composer{position:sticky;bottom:0;margin-top:18px;background:var(--canvas);padding:10px 0 0}

/* ---------- quotes ---------- */
.quote{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:16px 18px}
.quote blockquote{margin:8px 0 10px;font:500 18px/1.45 var(--serif)}
.quote blockquote.para{font:italic 400 16px/1.5 var(--serif);color:var(--ink-2)}
.qbadge{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:3px}
.qbadge.v{background:var(--ink);color:var(--paper)}
.qbadge.p{border:1px solid var(--muted);color:var(--muted)}
.timeline{position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--rule)}
.tl-item{position:relative;padding-bottom:18px}
.tl-item::before{content:"";position:absolute;left:-21px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--ink)}
.tl-item.hot::before{border-color:var(--red);background:var(--red)}
.tl-date{font-size:12px;color:var(--muted);font-weight:600}
.phase{font:600 13px/1 var(--sans);color:var(--red);margin:4px 0 12px -22px;padding-left:22px}

/* ---------- network ---------- */
.mode-card{text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:8px;min-height:170px}
.mode-card:hover{border-color:var(--ink)}
.mode-card .q{font:500 17px/1.35 var(--serif)}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:3px}
.pill.p0{background:var(--red);color:#fff}
.pill.prev{background:var(--canvas);color:var(--muted);border:1px solid var(--rule)}
.graph{background:var(--paper);border:1px solid var(--rule);border-radius:6px;position:relative}
.graph svg{display:block;width:100%;height:auto}
.graph .edge{cursor:pointer}
.graph .edge:hover line,.graph .edge.sel line{stroke-width:4}
.graph .node{cursor:pointer}
.graph .node:hover circle,.graph .node.sel circle{stroke:var(--red);stroke-width:3}
.path-flow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:14px;background:var(--canvas);border-radius:4px}
.path-node{background:var(--paper);border:1.5px solid var(--ink);border-radius:4px;padding:6px 10px;font-weight:600;font-size:14px}
.path-edge{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--ev-reported);min-width:110px;text-align:center}
.path-edge::after{content:"";display:block;width:100%;height:2px;background:var(--ev-reported);margin-top:3px}

/* ---------- listening ---------- */
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto}
.bar{cursor:pointer}
.bar:hover{opacity:.75}
.sentbar{display:flex;height:22px;border-radius:3px;overflow:hidden;font-size:11px;color:#fff;font-weight:600}
.sentbar span{display:grid;place-items:center}
.s-pos{background:#2E8B57}.s-neu{background:#8A8A8A}.s-neg{background:var(--red)}.s-unk{background:repeating-linear-gradient(45deg,var(--rule),var(--rule) 4px,var(--paper) 4px,var(--paper) 8px);color:var(--muted)!important}
.hbar{display:grid;grid-template-columns:140px 1fr 48px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.hbar .track{height:10px;background:var(--rule-2);border-radius:2px;overflow:hidden}
.hbar .fill{height:100%;background:var(--ink)}
.hbar .fill.unk{background:repeating-linear-gradient(45deg,var(--faint),var(--faint) 3px,transparent 3px,transparent 6px)}
.post{border:1px solid var(--rule);border-radius:4px;padding:11px 13px;background:var(--paper)}
.src-tag{font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px}
.src-tag.news{background:var(--ev-reported-bg);color:var(--news)}
.src-tag.social{background:var(--red-tint);color:var(--social)}

/* ---------- stepper ---------- */
.stepper{display:flex;gap:0;margin-bottom:22px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);overflow-x:auto}
.step{flex:1;display:flex;gap:10px;align-items:center;padding:12px 16px;border-right:1px solid var(--rule-2);font-size:13px;color:var(--muted);min-width:150px;background:none;border-top:0;border-bottom:0;border-left:0;text-align:left}
.step:last-child{border-right:0}
.step .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.step.on{color:var(--ink);font-weight:600}
.step.on .n{border-color:var(--red);background:var(--red);color:#fff}
.step.done .n{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:14px 16px}
.opt:hover{border-color:var(--ink-2)}
.opt.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.opt b{display:block;font-size:15px;margin-bottom:3px}
.inherit{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--ev-reported);background:var(--ev-reported-bg);border-radius:6px;padding:12px 14px;margin-bottom:18px;font-size:14px}
.progress{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin:16px 0}
.progress i{display:block;height:100%;width:0;background:var(--red);animation:load 1.6s ease-out forwards}
@keyframes load{to{width:100%}}

/* ---------- report ---------- */
.report-head{background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:20px 22px;margin-bottom:18px}
.finding{border:1px solid var(--rule);border-radius:6px;padding:14px 16px;background:var(--paper)}
.finding h4{margin:6px 0 6px;font:600 16px/1.35 var(--serif)}
.risk-level{font-size:12px;font-weight:700}
.status{font-size:12px;font-weight:700;padding:2px 8px;border-radius:3px;white-space:nowrap}
.st-checked{background:var(--ev-verified-bg);color:var(--ev-verified)}
.st-partial{background:var(--ev-unverified-bg);color:var(--ev-unverified)}
.st-not{background:var(--canvas);color:var(--muted);border:1px dashed var(--faint)}
.lifecycle{display:flex;flex-wrap:wrap;gap:0;margin:10px 0 4px}
.lc{font-size:12px;padding:5px 12px 5px 16px;background:var(--canvas);position:relative;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%)}
.lc:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);padding-left:12px}
.lc.done{background:var(--ink);color:var(--paper)}
.lc.now{background:var(--red);color:#fff;font-weight:600}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.diff>div{border:1px solid var(--rule);border-radius:4px;padding:12px}
.diff .after{border-color:var(--red)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:36px 20px;color:var(--ink-2)}
.empty h3{margin-bottom:6px}

/* ---------- overlays ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--paper);z-index:50;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;border-left:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.show{transform:none}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule)}
.drawer-b{padding:18px;overflow-y:auto;flex:1}
.excerpt{font:400 16px/1.6 var(--serif);border-left:3px solid var(--red);padding:4px 0 4px 14px;margin:14px 0;background:none}
.excerpt mark{background:var(--red-tint);color:inherit;padding:0 2px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);width:min(620px,calc(100% - 32px));max-height:calc(100% - 64px);overflow-y:auto;background:var(--paper);border-radius:8px;z-index:60;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;border:1px solid var(--rule)}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal-h{padding:18px 22px 0}
.modal-b{padding:16px 22px}
.modal-f{padding:14px 22px;border-top:1px solid var(--rule-2);display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:6px;font-size:14px;z-index:70;opacity:0;transition:all .2s;max-width:min(520px,calc(100% - 32px));pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pop{position:absolute;z-index:30;background:var(--paper);border:1px solid var(--ink);border-radius:6px;padding:12px 14px;width:300px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.12)}

/* ---------- save/follow ---------- */
.sf{display:inline-flex;gap:6px}
.sf .btn.is{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sf .btn.fol.is{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- responsive ---------- */

/* ================= v2 components ================= */
.wz{max-width:940px;margin:0 auto}
.wz-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.wz-prog{display:flex;align-items:center;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.wz-st{display:flex;align-items:center;gap:7px;flex-shrink:0;background:none;border:0;padding:0;color:var(--muted);font-size:12.5px;font-weight:600}
.wz-st .c{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:12px;background:var(--paper)}
.wz-st.on{color:var(--ink)} .wz-st.on .c{background:var(--red);border-color:var(--red);color:#fff}
.wz-st.done .c{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.wz-arr{width:22px;height:1.5px;background:var(--rule);margin:0 6px;flex-shrink:0}
.wz-card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:20px 22px}
.wz-foot{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule-2);margin-top:18px;padding-top:16px;flex-wrap:wrap}
.ai-note{display:flex;gap:10px;align-items:flex-start;background:var(--ev-reported-bg);color:var(--ink);border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:16px}
.ai-note b{color:var(--ev-reported)}
.health{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.health>div{background:var(--canvas);border-radius:6px;padding:10px 12px;text-align:center}
.health .l{font-size:11.5px;color:var(--muted);font-weight:600}
.health .v{font:600 18px/1.3 var(--serif)}
.clu{border:1px solid var(--rule);border-radius:8px;padding:13px 14px;margin-bottom:10px;background:var(--paper)}
.clu-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.clu-n{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.clu-n .num{background:var(--ink);color:var(--paper);border-radius:4px;padding:0 7px;font-size:11px}
.kw{display:inline-flex;align-items:center;gap:6px;background:var(--canvas);border:1px solid var(--rule);border-radius:999px;padding:3px 5px 3px 11px;font-size:12.5px;margin:0 5px 6px 0}
.kw.new{background:var(--ev-verified-bg);border-color:transparent;color:var(--ev-verified)}
.kw.ex{background:var(--red-tint);border-color:transparent;color:var(--red)}
.kw button{width:17px;height:17px;border-radius:50%;border:0;background:rgba(0,0,0,.08);font-size:10px;line-height:1;display:grid;place-items:center;color:inherit;padding:0}
.kw button:hover{background:var(--red);color:#fff}
.kw-in{border:1.5px dashed var(--rule);border-radius:999px;padding:3px 11px;font-size:12.5px;background:none;width:150px;outline:none}
.kw-in:focus{border-color:var(--ink)}
.tgl{width:36px;height:20px;border-radius:999px;background:var(--rule);position:relative;border:0;padding:0;flex-shrink:0}
.tgl::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tgl.on{background:var(--ev-verified)} .tgl.on::after{left:18px}
.ent-row{border:1px solid var(--rule);border-radius:6px;padding:8px 12px;margin-bottom:6px;background:var(--paper)}
.ent-row summary{cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:600;list-style:none}
.ent-row summary::-webkit-details-marker{display:none}
.excl{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--rule);border-radius:6px;padding:8px 12px;margin-bottom:6px;font-size:13.5px;background:var(--paper);gap:10px}
.mode-opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--rule);border-radius:8px;padding:12px 14px;cursor:pointer;flex:1;min-width:220px;background:var(--paper);text-align:left}
.mode-opt.sel{border-color:var(--ink);background:var(--canvas)}
.mode-opt .r{width:16px;height:16px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0;margin-top:2px;position:relative}
.mode-opt.sel .r{border-color:var(--ink)} .mode-opt.sel .r::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.plat{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--rule);border-radius:8px;padding:11px 13px;background:var(--paper);cursor:pointer}
.plat.on{border-color:var(--ink)}
.plat input{accent-color:var(--red);margin-top:3px}
.proc{list-style:none;margin:16px 0;padding:0}
.proc li{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;color:var(--faint)}
.proc li .dot{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;font-size:11px}
.proc li.done{color:var(--ink)} .proc li.done .dot{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.proc li.now{color:var(--ink);font-weight:600} .proc li.now .dot{border-color:var(--red);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* insight shell */
.ins-hero{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:18px 20px;margin-bottom:12px}
.ins-hero h1{font-size:27px}
.ins-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:12px;align-items:center}
.ins-nav{display:flex;gap:2px;overflow-x:auto;position:sticky;top:-28px;background:var(--paper);z-index:15;margin-bottom:16px;border:1px solid var(--rule);border-radius:8px;padding:0 6px}
.ins-nav button{padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.ins-nav button.on{color:var(--red);border-bottom-color:var(--red)}
.badge-custom{display:inline-flex;align-items:center;gap:4px;background:var(--ev-reported-bg);color:var(--ev-reported);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge-tempo{display:inline-flex;align-items:center;gap:4px;background:var(--red-tint);color:var(--red);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}
.status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:700}
.sp-esc{background:var(--red-tint);color:var(--red)} .sp-rise{background:var(--ev-unverified-bg);color:var(--ev-unverified)} .sp-stable{background:var(--canvas);color:var(--muted)}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 18px}
.card+.card{margin-top:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:17px}
.sub-h{font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 0 8px}
.snote{background:var(--canvas);border-radius:6px;padding:9px 12px;font-size:13px;color:var(--ink-2);margin-top:10px}
.snote.blue{background:var(--ev-reported-bg)}
.accent-l{border-left:4px solid var(--red)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{background:var(--canvas);border-radius:8px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font:600 25px/1.2 var(--serif);font-variant-numeric:tabular-nums;margin:3px 0}
.kpi .p{font-size:11.5px;color:var(--muted)}
.kpi .p b{color:var(--ev-verified)}
.kpi .p b.neg{color:var(--red)}
.chbar{display:grid;grid-template-columns:22px 92px 1fr 92px;gap:8px;align-items:center;font-size:13px;padding:4px 0}
.chbar .tr{height:9px;background:var(--rule-2);border-radius:999px;overflow:hidden}
.chbar .tr i{display:block;height:100%;border-radius:999px}
.chbar .val{text-align:right;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.plat-ic{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart svg{display:block;width:100%;height:auto}
.chart .hit{cursor:pointer;fill:transparent}
.chart .hit:hover{fill:var(--rule-2);fill-opacity:.6}
.stackbar{display:flex;height:22px;border-radius:4px;overflow:hidden;font-size:11px;font-weight:700;color:#fff}
.stackbar span{display:grid;place-items:center;white-space:nowrap;overflow:hidden}
.clcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.clcard{border-radius:8px;padding:12px 14px;font-size:13px}
.clcard h4{margin:0 0 6px;font-size:14px}
.clcard ul{margin:0;padding-left:18px;color:var(--ink-2)} .clcard li{margin:2px 0}
.cl-neg{background:var(--red-tint)} .cl-neg h4{color:var(--red)}
.cl-pos{background:var(--ev-verified-bg)} .cl-pos h4{color:var(--ev-verified)}
.cl-neu{background:var(--canvas)} .cl-neu h4{color:var(--ink-2)}
.cl-med{background:var(--ev-reported-bg)} .cl-med h4{color:var(--ev-reported)}
.platgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.platcard{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper)}
.emo{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.emo .tr{height:12px;background:var(--rule-2);border-radius:3px;overflow:hidden}
.emo .tr i{display:block;height:100%}
.emoji-row{display:flex;flex-wrap:wrap;gap:10px}
.emoji-row div{background:var(--canvas);border-radius:8px;padding:8px 12px;text-align:center;min-width:70px}
.emoji-row b{display:block;font-size:24px;line-height:1.2}
.issue-row{display:grid;grid-template-columns:26px 1fr 170px 70px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--rule-2)}
.issue-row:last-child{border-bottom:0}
.wcloud{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:center;padding:14px;background:var(--canvas);border-radius:8px;line-height:1.15}
.wcloud span{font-family:var(--serif);font-weight:600}
.voice{border:1px solid var(--rule);border-radius:8px;padding:13px 15px;background:var(--paper)}
.voice blockquote{margin:8px 0;font:400 15px/1.5 var(--serif);color:var(--ink-2)}
.heat{display:grid;gap:2px;font-size:11px}
.heat .cell{height:20px;border-radius:2px}
.heat .rl{color:var(--muted);font-weight:600;display:flex;align-items:center}
.inf-tbl td,.inf-tbl th{white-space:nowrap}
.postcard{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper);display:flex;flex-direction:column;gap:6px}
.postcard .met{font:600 18px/1 var(--serif)}
/* map */
.mapwrap{position:relative;background:#BFE3EE;border-radius:8px;overflow:hidden;border:1px solid var(--rule)}
:root[data-theme="dark"] .mapwrap{background:#13303a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mapwrap{background:#13303a}}
.mapwrap svg{display:block;width:100%;height:auto;cursor:grab}
.mapwrap .prov{fill:#F4F1E4;stroke:#9DB7A6;stroke-width:.6}
:root[data-theme="dark"] .mapwrap .prov{fill:#2b3a33;stroke:#4c6a5a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mapwrap .prov{fill:#2b3a33;stroke:#4c6a5a}}
.mapwrap .prov.sel{fill:#E9E2C6}
.mapwrap .bub{cursor:pointer;stroke:#fff;stroke-width:1.2;fill-opacity:.72}
.mapwrap .bub:hover{fill-opacity:.95}
.mapwrap .bub.sel{stroke:#1F4E8C;stroke-width:3;fill-opacity:.9}
.mapwrap .plabel{font:700 9px var(--sans);fill:#55606a;letter-spacing:.06em;pointer-events:none;text-transform:uppercase}
.map-ctrl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.map-ctrl button{width:34px;height:34px;border-radius:4px;border:0;background:var(--red);color:#fff;font-size:17px;font-weight:700;display:grid;place-items:center}
.map-ctrl button.w{background:var(--paper);color:var(--ink);border:1px solid var(--rule)}
.map-legend{position:absolute;left:10px;top:10px;background:var(--paper);border-radius:6px;padding:8px 10px;font-size:11.5px;border:1px solid var(--rule)}
.map-legend .grad{height:8px;width:150px;border-radius:2px;background:linear-gradient(90deg,#F2D84B,#E89A2C,#D23B2A);margin:4px 0}
.map-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font-size:12px;padding:6px 9px;border-radius:4px;display:none;white-space:nowrap}
/* force graph */
.fg{position:relative;background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;background-image:radial-gradient(var(--rule-2) 1px,transparent 1px);background-size:18px 18px}
.fg svg{display:block;width:100%;height:auto;cursor:grab}
.fg .nd{cursor:pointer}
.fg .nd text{font:600 10.5px var(--sans);fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--paper);stroke-width:3px}
.fg .nd.sel circle{stroke:var(--red);stroke-width:3}
.fg .lk{stroke:var(--faint);stroke-opacity:.55}
.fg-ctrl{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.fg-ctrl button{width:28px;height:28px;border:1px solid var(--rule);background:var(--paper);border-radius:4px;font-weight:700}
/* signal monitor */
.sig-card{background:var(--paper);border:1.5px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
.sig-card:hover{border-color:var(--ink)}
.sig-card .nm{font:600 16px/1.3 var(--serif)}
.sig-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);align-items:center}
.sig-hero{background:var(--side);color:#fff;border-radius:10px;padding:24px 26px;position:relative;overflow:hidden}
.sig-hero::before{content:"";position:absolute;right:-50px;top:-50px;width:210px;height:210px;border-radius:50%;background:rgba(215,25,32,.22)}
.sig-hero h2{color:#fff;position:relative}
.sig-hero p{color:rgba(255,255,255,.72);max-width:60ch;position:relative;font-size:14px}
.snap-head{font:600 16.5px/1.5 var(--serif);margin:0 0 12px}
.kp{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule-2);font-size:14px}
.kp:last-child{border-bottom:0}
.kp::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red);flex-shrink:0;margin-top:8px}
.box2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.box2>div{background:var(--canvas);border-radius:6px;padding:10px 12px;font-size:13.5px}
.box2 .l{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.wc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wc{border:1px solid var(--rule);border-left:4px solid var(--red);border-radius:6px;padding:12px 14px;background:var(--paper)}
.wc h4{margin:6px 0 4px;font-size:14.5px}
.pos-pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}

.lvl{font-size:11.5px;font-weight:700;border-radius:3px;padding:2px 8px;white-space:nowrap}
.lv-h{background:var(--red-tint);color:var(--red)} .lv-m{background:var(--ev-unverified-bg);color:var(--ev-unverified)} .lv-l{background:var(--canvas);color:var(--muted)} .lv-p{background:var(--ev-verified-bg);color:var(--ev-verified)}
.rsig{display:flex;gap:14px;border:1px solid var(--rule);border-radius:8px;padding:12px 14px;background:var(--paper);cursor:pointer;text-align:left;width:100%}

.tag{background:var(--canvas);border-radius:3px;padding:1px 8px;font-size:11.5px;font-weight:600}
.tdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex-shrink:0}

.mit{background:var(--canvas);border-radius:6px;padding:9px 12px;font-size:13.5px;margin-top:6px}

.kf{display:grid;grid-template-columns:150px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule-2);font-size:13.5px;align-items:start}

.kf .k{color:var(--muted);font-weight:600}
.kf .m{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.vb{font-size:11px;font-weight:700;border-radius:3px;padding:1px 7px;white-space:nowrap}
.vb-v{background:var(--ev-verified-bg);color:var(--ev-verified)} .vb-p{background:var(--ev-unverified-bg);color:var(--ev-unverified)} .vb-c{background:var(--red-tint);color:var(--red)} .vb-n{background:var(--ev-reported-bg);color:var(--ev-reported)} .vb-i{background:var(--canvas);color:var(--muted)}
.dims{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.dp-det{background:var(--red-tint);color:var(--red)} .dp-unr{background:var(--ev-unverified-bg);color:var(--ev-unverified)} .dp-imp{background:var(--ev-reported-bg);color:var(--ev-reported)} .dp-st{background:var(--ev-verified-bg);color:var(--ev-verified)} .dp-ins{background:var(--canvas);color:var(--muted)}
.dir-down{color:var(--red);font-weight:700} .dir-mix{color:var(--ev-unverified);font-weight:700} .dir-up{color:var(--ev-verified);font-weight:700} .dir-flat{color:var(--muted);font-weight:700}
.td-tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:14px 0 14px;overflow-x:auto}

.td-tabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--red)}
.fnd{display:flex;gap:12px;border-left:3px solid var(--red);padding:8px 0 8px 12px;margin-bottom:10px;background:linear-gradient(90deg,var(--canvas),transparent 60%)}

.narr{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;margin-top:8px}

.lens-card{border:1.5px solid var(--rule);border-radius:10px;padding:16px;background:var(--paper);text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.lens-card:hover{border-color:var(--ink)}
.lens-card .ic{font-size:22px}
.esg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.esg>div{border-radius:8px;padding:12px 14px;font-size:13.5px}
.esg .h{font-size:12px;font-weight:800;margin-bottom:5px}
.e-env{background:var(--ev-verified-bg)} .e-env .h{color:var(--ev-verified)}
.e-soc{background:var(--ev-unverified-bg)} .e-soc .h{color:var(--ev-unverified)}
.e-gov{background:var(--red-tint)} .e-gov .h{color:var(--red)}
.seg2{display:inline-flex;background:var(--canvas);border:1px solid var(--rule);border-radius:6px;padding:2px;gap:2px}

.seg2 button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

.kp.kp-lv::before{display:none}
/* ===== Ask Tempo chat layout ===== */
.content.flush{padding:0;overflow:hidden}
.opt>span{display:block}
.opt>span.row{display:flex}
.ask-shell{display:grid;grid-template-columns:260px 1fr;height:100%;min-height:0}
.ask-hist{border-right:1px solid var(--rule);background:var(--paper);padding:14px 10px;overflow-y:auto}
.hist-g{font-size:11.5px;font-weight:700;color:var(--muted);margin:14px 8px 4px}
.hist-i{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-i:hover{background:var(--canvas);color:var(--ink)}
.hist-i.on{background:var(--canvas);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--red)}
.ask-main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%}
.ask-top{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--rule-2);background:var(--paper)}
.ask-hist-btn{display:none}
.chat-scroll{flex:1;overflow-y:auto;padding:20px 20px 10px}
.chat-inner{max-width:800px;margin:0 auto}
.composer2{border-top:1px solid var(--rule-2);background:var(--canvas);padding:10px 20px 12px}
.sugg{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.sugg .chip{flex-shrink:0;white-space:nowrap;font-size:12.5px;padding:5px 11px}
.sugg .chip.act{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sugg .chip.act svg{width:13px;height:13px}
.ask-empty{text-align:center;padding:9vh 0 20px}
.ask-empty h1{margin-top:12px}
.tempo-dot.big{width:44px;height:44px;font-size:22px;margin:0 auto;display:grid;place-items:center;background:var(--red);color:#fff;font-family:var(--serif);font-weight:700}
.answer{margin-bottom:6px}
.ans-sec{font:600 14px var(--sans);margin:14px 0 2px;color:var(--ink)}
.ans-tools{display:flex;gap:2px;margin-top:10px;border-top:1px solid var(--rule-2);padding-top:6px}
.none-ans{border-style:dashed}
.none-ic{width:34px;height:34px;border-radius:50%;background:var(--canvas);display:grid;place-items:center;flex-shrink:0;color:var(--muted)}
.typing{display:flex;gap:4px;margin:4px 0 6px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (max-width:860px){
  .ask-shell{grid-template-columns:1fr}
  .ask-hist{display:none;position:absolute;z-index:20;top:0;bottom:0;left:0;width:280px;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  .ask-shell{position:relative}
  .ask-shell.hist-open .ask-hist{display:block}
  .ask-hist-btn{display:inline-flex}
  .chat-scroll{padding:14px 12px 8px}.composer2{padding:8px 12px 10px}.ask-top{padding:8px 12px}
}
/* ===== Quotes v3 ===== */
.qc,.pc{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:16px 18px}
.qc-h{display:flex;align-items:center;gap:12px}
.qc-h>div{flex:1}
.avatar.qa{width:38px;height:38px;background:var(--ink);color:var(--paper);font-size:13px;flex-shrink:0}
.qc-date{font-size:13px;font-weight:700;white-space:nowrap}
.qc-tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px;align-items:center}
.qtype{font-size:11.5px;font-weight:700;border-radius:3px;padding:2px 8px;cursor:help;white-space:nowrap}
.qtype.dq{background:var(--ink);color:var(--paper)}
.qtype.pq{background:transparent;color:var(--ink-2);border:1px solid var(--faint)}
.qtype.sm{font-size:10.5px;padding:1px 6px;vertical-align:2px}
.qc-body{position:relative;padding:4px 0 4px 18px;margin:0 0 12px}
.qc-body p{margin:0;font:400 17.5px/1.55 var(--serif);color:var(--ink)}
.qc-body.dq{border-left:3px solid var(--red)}
.qc-body.dq .qmark{position:absolute;left:12px;top:-6px;font:700 34px/1 var(--serif);color:var(--red)}
.qc-body.dq p{padding-left:16px}
.qc-body.pq{border-left:3px dashed var(--faint)}
.qc-body.pq p{color:var(--ink-2)}
.qc-body.pq .xs{margin-top:4px}
.qc-ctx{background:var(--canvas);border-radius:6px;padding:9px 12px;font-size:13.5px;color:var(--ink-2)}
.qc-ctx .l{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.qc-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--rule-2)}
.faint{color:var(--faint)}
.pc .btn.fol.is{background:var(--red);border-color:var(--red);color:#fff}
.pc-sum{display:flex;gap:12px;align-items:flex-start;border-radius:6px;padding:11px 13px;margin:14px 0 6px;background:var(--canvas)}
.pc-sum>span{font-size:20px;line-height:1;font-weight:700}
.pc-sum.shift{background:var(--red-tint)} .pc-sum.shift>span{color:var(--red)}
.pc-sum.same{background:var(--ev-verified-bg)} .pc-sum.same>span{color:var(--ev-verified)}
.pc-tl{list-style:none;margin:10px 0 0;padding:0}
.pc-tl li{display:grid;grid-template-columns:22px 1fr;position:relative}
.pc-tl li::before{content:"";position:absolute;left:6px;top:14px;bottom:-4px;width:2px;background:var(--rule)}
.pc-tl li:last-child::before{display:none}
.pc-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);margin-top:12px;position:relative;z-index:1}
.pc-tl li.chg .pc-dot{border-color:var(--red);background:var(--red)}
.pc-it{border:1px solid var(--rule-2);border-radius:6px;padding:10px 12px;margin:4px 0 8px}
.pc-q{margin:6px 0 6px;font:400 15.5px/1.5 var(--serif)}
/* ===== Network Explorer ===== */
.nx-modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.nx-modes button{text-align:left;border:1.5px solid var(--rule);background:var(--paper);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.nx-modes button b{font:600 15.5px var(--serif)}
.nx-modes button span{font-size:12.5px;color:var(--muted)}
.nx-modes button.on{border-color:var(--red);box-shadow:inset 0 3px 0 var(--red)}
.nx-form{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:14px 16px}
.nx-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.nx-row>div{min-width:150px}
.nx-swap{align-self:center;font-size:20px;color:var(--muted);padding-top:18px}
.nx-chosen{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;background:var(--canvas);border-radius:6px;padding:6px 10px;font-size:13.5px}
.nx-cands{display:grid;gap:6px;margin-top:8px}
.nx-cands .opt{padding:9px 12px}
.tpill{display:inline-block;font:700 10.5px var(--sans);color:var(--c);border:1px solid var(--c);border-radius:999px;padding:1px 8px;vertical-align:3px;white-space:nowrap}
.nx-res{margin-top:0}
.nx-head{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:12px 16px;margin-bottom:10px;flex-wrap:wrap}

.issue-chip{width:34px;height:34px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-size:18px}

.cdot{width:9px;height:9px;border-radius:2px;display:inline-block}
.nx-grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;align-items:start}
.nx-graph svg{display:block;width:100%;height:auto;cursor:grab}
.nx-ring{fill:none;stroke:var(--rule);stroke-dasharray:3 5}
.nxe{cursor:pointer}
.nxe:hover path:last-of-type,.nxe.sel path:last-of-type{stroke-width:5}

.nxl.big{font:700 13.5px var(--serif)}
.nxs{font:600 9.5px var(--sans);fill:var(--muted);paint-order:stroke;stroke:var(--paper);stroke-width:3px;pointer-events:none}
.nx-legend{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);margin-top:8px}

function spark(arr, w=90, h=26, color='var(--red)'){
  const max = Math.max(...arr), min = Math.min(...arr);
  const pts = arr.map((v,i) => `${(i/(arr.length-1))*w},${h-2-((v-min)/(max-min||1))*(h-4)}`).join(' ');
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8"/></svg>`;
}

  Object.entries(ISS).forEach(([k,v])=>{ v.t.forEach(t=>{ if(s.includes(t)){ if(!issues.includes(k)) issues.push(k); s=s.replace(t,' '); } }); });
  const kw = s.replace(/\b(pt|tbk|soal|tentang|terhadap|dan|on|about|the|of|di|ke|yang|apa|kata|said)\b/g,' ').split(/\s+/).filter(w=>w.length>2);
  return {terms, issues, kw};

function cnPaths(a,b,cat,tf){
  const ed = nxEdges({tf}).filter(e=>!nxIsCtx(e) && (cat==='Semua kategori'||nxCat(e)===cat||nxIsClaim(e)));
  const direct = ed.filter(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a)).map(e=>({hops:1, edges:[e], via:[]}));
  const NA = nxNeighbors(a,ed), NB = nxNeighbors(b,ed);
  const ind=[]; NA.forEach(x=>{ if(x.o===b) return; NB.filter(y=>y.o===x.o).forEach(y=>ind.push({hops:2, edges:[x.e,y.e], via:[x.o]})); });
  const sc=p=>Math.min(...p.edges.map(e=>nxStrength(e).k))*10+p.edges.reduce((s,e)=>s+e.n,0);
  ind.sort((p,q)=>sc(q)-sc(p));
  const ctx = NE.filter(e=>nxIsCtx(e)&&((e.a===a&&e.b===b)||(e.a===b&&e.b===a)));
  return {direct, ind, all:[...direct,...ind], ctx};
}

function nxBFS(f, edges, depth, expanded){
  const info = new Map([[f,{lv:0,p:null,e:null,kids:[]}]]); let frontier=[f];
  for(let lv=1; frontier.length; lv++){
    const next=[];
    frontier.forEach(id=>{ const pl=info.get(id).lv; if(pl>=depth && !(expanded&&expanded.has(id))) return; if(pl>depth) return;
      nxNeighbors(id,edges).sort((a,b)=>['Structure','Politics','Law','Uang & lainnya','Claim','Context'].indexOf(nxCat(a.e))-['Structure','Politics','Law','Uang & lainnya','Claim','Context'].indexOf(nxCat(b.e))||b.e.n-a.e.n).forEach(x=>{ if(info.has(x.o)) return; info.set(x.o,{lv:pl+1,p:id,e:x.e,kids:[]}); info.get(id).kids.push(x.o); next.push(x.o); }); });
    frontier=next;
  }
  return info;
}

const fmt = n => n>=1e6 ? (n/1e6).toFixed(1).replace(/\.0$/,'')+'M' : n>=1e3 ? (n/1e3).toFixed(1).replace(/\.0$/,'')+'k' : String(n);
const pct = (a,b) => Math.round(a/b*100);
const niceMax = m => { const p = Math.pow(10, Math.floor(Math.log10(m||1))); return Math.ceil(m/p*2)/2*p; };

  x:{n:'X / Twitter', c:'#1A1A1A', a:'X'}, tiktok:{n:'TikTok', c:'#EE1D52', a:'TT'}, ig:{n:'Instagram', c:'#C13584', a:'IG'},
  fb:{n:'Facebook', c:'#1877F2', a:'f'}, yt:{n:'YouTube', c:'#FF0000', a:'▶'}, threads:{n:'Threads', c:'#555', a:'@'}, news:{n:'Berita online', c:'#1F4E8C', a:'N'}

/* multi-series line chart. o = {labels, series:[{n,c,d}], h, marks:[{i,t}], act, sel} */
function lineChart(o){
  const w=760, h=o.h||220, pl=46, pr=14, pt=16, pb=28;
  const all = o.series.flatMap(s=>s.d.filter(v=>v!=null));
  const max = niceMax(Math.max(...all));
  const n = o.labels.length;
  const X = i => pl + i*(w-pl-pr)/(n-1);
  const Y = v => pt + (1-v/max)*(h-pt-pb);
  const step = Math.ceil(n/7);
  let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.aria||'Grafik tren')}">`;
  [0,.5,1].forEach(f=>{ s+=`<line x1="${pl}" x2="${w-pr}" y1="${Y(max*f)}" y2="${Y(max*f)}" stroke="var(--rule-2)" stroke-dasharray="${f?'4 4':''}"/><text x="${pl-7}" y="${Y(max*f)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(Math.round(max*f))}</text>`; });
  o.labels.forEach((l,i)=>{ if(i%step===0 || i===n-1) s+=`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${l}</text>`; });
  (o.gaps||[]).forEach(i=>{ s+=`<rect x="${X(i)-6}" y="${pt}" width="12" height="${h-pt-pb}" fill="url(#hatch2)"/><title>Data kosong</title>`; });
  if(o.sel!=null) s+=`<line x1="${X(o.sel)}" x2="${X(o.sel)}" y1="${pt}" y2="${h-pb}" stroke="var(--ink)" stroke-width="1.5"/>`;
  (o.marks||[]).forEach(m=>{ const x=X(m.i); s+=`<line x1="${x}" x2="${x}" y1="${pt}" y2="${h-pb}" stroke="var(--red)" stroke-dasharray="3 3"/><g><rect x="${Math.min(x+4,w-pr-150)}" y="${pt}" width="146" height="18" rx="3" fill="var(--paper)" stroke="var(--red)"/><text x="${Math.min(x+10,w-pr-144)}" y="${pt+13}" font-size="10.5" font-weight="700" fill="var(--red)">${esc(m.t)}</text></g>`; });
  o.series.forEach(se=>{
    let seg=[], segs=[];
    se.d.forEach((v,i)=>{ if(v==null){ if(seg.length) segs.push(seg); seg=[]; } else seg.push(`${X(i).toFixed(1)},${Y(v).toFixed(1)}`); });
    if(seg.length) segs.push(seg);
    segs.forEach(p=> s+=`<polyline points="${p.join(' ')}" fill="none" stroke="${se.c}" stroke-width="2.2" stroke-linejoin="round"/>`);
    if(n<=31) se.d.forEach((v,i)=>{ if(v!=null) s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${se.c}"/>`; });
  });
  if(o.act){ const bw=(w-pl-pr)/(n-1); o.labels.forEach((l,i)=>{ s+=`<rect class="hit" data-a="${o.act}" data-d="${i}" x="${X(i)-bw/2}" y="${pt}" width="${bw}" height="${h-pt-pb}"><title>${l}: ${o.series.map(se=>se.n+' '+(se.d[i]==null?'tidak ada data':fmt(se.d[i]))).join(', ')}</title></rect>`; }); }
  s+=`<defs><pattern id="hatch2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--faint)" stroke-width="2"/></pattern></defs></svg>`;
  const leg = `<div class="legend2">${o.series.map(se=>`<span><i style="background:${se.c}"></i>${se.n}</span>`).join('')}${(o.gaps||[]).length?'<span><i style="background:repeating-linear-gradient(45deg,var(--faint),var(--faint) 2px,transparent 2px,transparent 4px)"></i>Data kosong</span>':''}</div>`;
  return `<div class="chart">${s}${leg}</div>`;
}

function mountMap(id, data, selName, act){

  const path = d3.geoPath(proj);

  const max = Math.max(...Object.values(data).map(d=>d.m));

  const bubbles = IDN_GEO.features.map(f=>{ const d=data[f.properties.n]; if(!d) return null; const [x,y]=path.centroid(f); return {f,d,x,y,r:4+Math.sqrt(d.m/max)*26}; }).filter(Boolean).sort((a,b)=>b.r-a.r);
  bubbles.forEach(b=>{ const v = metric==='neg' ? (b.d.neg-.2)/.55 : Math.sqrt(b.d.m/max); s+=`<circle class="bub ${b.f.properties.n===selName?'sel':''}" data-a="${act}" data-p="${b.f.properties.n}" data-tip="${esc(titleCase(b.f.properties.n))}: ${fmt(b.d.m)} mention, ${Math.round(b.d.neg*100)}% negative" cx="${b.x}" cy="${b.y}" r="${b.r}" fill="${col(v)}" tabindex="0" role="button" aria-label="${esc(titleCase(b.f.properties.n))}"/>`; });
  bubbles.filter(b=>b.r>13).forEach(b=>{ s+=`<text class="plabel" x="${b.x}" y="${b.y+b.r+10}" text-anchor="middle">${esc(shortProv(b.f.properties.n))}</text>`; });
  s += `</g></svg>`;
  el.insertAdjacentHTML('afterbegin', s);
  const svg = el.querySelector('svg'), tip = el.querySelector('.map-tip');

  d3.select(svg).call(z); MAPZ[id] = {svg, z};
  if(MAPZ[id+'_t']) d3.select(svg).call(z.transform, MAPZ[id+'_t']);

}

ACT['imap-z'] = (el,d)=>{ const z=S.lis.mz||1; S.lis.mz = +d.z===0?1:Math.min(2.5,Math.max(1,z+(+d.z)*.5)); rerender(); const w=document.querySelector('.imap-wrap'); if(w&&S.lis.mz>1){ const sp=document.querySelector('.spot.sel'); if(sp){ w.scrollLeft=sp.offsetLeft-w.clientWidth/2; w.scrollTop=sp.offsetTop-w.clientHeight/2; } } };
/* ---------- wizard ---------- */
const LIS_STEPS = ['Deskripsi','Definition','Kata kunci','Pengecualian','Sumber & jadwal','Tinjau'];
function lisWizard(){
  const L=S.lis, D=L.draft; let b='';
  if(L.step===1){
    b=`<h2 style="margin-bottom:4px">Apa yang ingin Anda pantau?</h2><p class="small muted" style="margin:0 0 12px">Jelaskan topik, merek, atau isu dengan bahasa sehari-hari. Kami akan menyarankan klaster kata kunci, entitas, dan pengecualian untuk Anda tinjau.</p>
      <label class="f" for="lp">Deskripsi</label><textarea class="input" id="lp" rows="6" data-bind="lis-prompt">${esc(D.prompt)}</textarea>
      <div class="grid g2" style="margin-top:14px;gap:12px">
        <div><label class="f">Industri</label><select class="select" data-bind="lis-industry">${['Pertambangan & logam','Energi','Otomotif','Jasa keuangan','Sektor publik','Barang konsumsi'].map(o=>`<option ${D.industry===o?'selected':''}>${o}</option>`).join('')}</select></div>
        <div><label class="f">Geografi</label><select class="select"><option>Indonesia</option><option>Indonesia + Southeast Asia</option></select></div>
        <div><label class="f">Periode pemantauan</label><select class="select" data-bind="lis-period">${['7 hari terakhir','30 hari terakhir','90 hari terakhir','Rentang khusus'].map(o=>`<option ${D.period===o?'selected':''}>${o}</option>`).join('')}</select></div>
        <div><label class="f">Tujuan pemantauan</label><select class="select" data-bind="lis-objective">${['Pemantauan isu & krisis','Reputasi merek','Respons kampanye atau kebijakan','Percakapan kompetitor','Tren pasar & konsumen'].map(o=>`<option ${D.objective===o?'selected':''}>${o}</option>`).join('')}</select></div>
      </div>
      <div class="wz-foot"><button class="btn" data-a="toast" data-m="Draf tersimpan.">Simpan sebagai draf</button><button class="btn primary" data-a="lis-gen">Sarankan pengaturan kata kunci</button></div>`;
  } else if(L.step===2){
    b=`<div class="ai-note">🤖 <span><b>Saran AI.</b> Ditafsirkan dari deskripsi Anda. Tinjau dan ubah sebelum melanjutkan; belum ada yang final sampai monitor dijalankan.</span></div>
      <div class="field"><label class="f">Nama monitor</label><input class="input" value="${esc(D.name)}" data-bind="lis-name"></div>
      <div class="field"><label class="f">Apa yang diukur monitor ini</label><textarea class="input" rows="2" data-bind="lis-goal">${esc(D.goal)}</textarea></div>
      <div class="field"><label class="f">Pertanyaan inti</label><textarea class="input" rows="2" data-bind="lis-question">${esc(D.question)}</textarea></div>
      <div class="grid g2" style="gap:12px"><div><label class="f">Bahasa</label><div class="row">${['Bahasa Indonesia','Bahasa Inggris','Bahasa daerah'].map(l=>`<button class="chipf ${D.langs.has(l)?'on':''}" data-a="lis-lang" data-l="${l}">${l}</button>`).join('')}</div></div>
      <div><label class="f">Geografi &amp; periode</label><div class="small" style="padding-top:6px">${esc(D.geo)} · ${esc(D.period)}</div></div></div>
      <div class="wz-foot"><button class="btn" data-a="lis-step" data-s="1">Kembali</button><button class="btn primary" data-a="lis-step" data-s="3">Lanjut</button></div>`;
  } else if(L.step===3){
    const at = activeTerms(D.clusters);
    const q = D.clusters.filter(c=>c.on);
    b=`<h2 style="margin-bottom:2px">Klaster kata kunci</h2><p class="small muted" style="margin:0 0 12px">Istilah yang disarankan, dikelompokkan per tema. Tambah, hapus, atau matikan seluruh klaster. Sebuah post harus cocok dengan klaster lokasi ditambah setidaknya satu klaster lain.</p>
      <div class="health"><div><div class="l">Cakupan</div><div class="v">Terfokus</div></div><div><div class="l">Risiko noise</div><div class="v" style="color:var(--ev-unverified)">Sedang</div></div><div><div class="l">Istilah aktif</div><div class="v">${at}</div></div><div><div class="l">Perkiraan volume</div><div class="v">~1,3rb/hari</div></div></div>
      <div class="ai-note" style="background:var(--ev-verified-bg)">💡 <span><b style="color:var(--ev-verified)">Saran perbaikan:</b> tambahkan ejaan lokal “Teluk Bulli” dan “Buli Asal” untuk mengurangi post dari Maluku Utara yang terlewat. <button class="linkish" data-a="lis-sugg">Tambahkan keduanya</button></span></div>
      ${clusterEditor('lis', D.clusters)}
      <div class="row" style="margin-top:4px"><input class="input" id="clu-new-lis" style="max-width:260px" placeholder="Nama klaster baru"><button class="btn" data-a="clu-add" data-s="lis">+ Tambah klaster</button></div>
      <details class="acc" style="margin-top:16px"><summary style="font-size:14px">Pratinjau kueri yang dihasilkan</summary><div class="acc-b"><pre style="white-space:pre-wrap;font-size:12px;background:var(--canvas);padding:12px;border-radius:6px;margin:12px 0 0;overflow-x:auto">(${(q.find(c=>c.mode==='all')||{kw:[]}).kw.map(k=>`"${k}"`).join(' OR ')})
AND (${q.filter(c=>c.mode!=='all').flatMap(c=>c.kw).slice(0,14).map(k=>`"${k}"`).join(' OR ')} …)
NOT (${D.excl.length} exclusion rules)</pre></div></details>
      <details class="acc"><summary style="font-size:14px">Entitas &amp; alias <span class="tag">${LIS_ENTS.reduce((a,g)=>a+g.e.length,0)} entitas</span></summary><div class="acc-b" style="padding-top:12px">
        ${LIS_ENTS.map(g=>`<div class="sub-h" style="margin-top:6px">${g.g}</div>${g.e.map(e=>`<details class="ent-row"><summary>${e[0]}<span class="tag">${e[1].length} alias</span></summary><div style="margin-top:8px">${e[1].map(a=>`<span class="kw" style="padding-right:11px">${a}</span>`).join('')}</div></details>`).join('')}`).join('')}
        <p class="xs muted" style="margin:8px 0 0">Alias dicocokkan sebagai entitas yang sama agar mention tidak terpecah atau terhitung ganda.</p></div></details>
      <div class="wz-foot"><button class="btn" data-a="lis-step" data-s="2">Kembali</button><button class="btn primary" data-a="lis-step" data-s="4" ${at?'':'disabled'}>Lanjut</button></div>`;
  } else if(L.step===4){
    b=`<h2 style="margin-bottom:2px">Pengecualian</h2><p class="small muted" style="margin:0 0 12px">Konten yang sengaja kami kecualikan untuk mengurangi noise.</p>
      ${exclEditor('lis', D.excl)}
      <div class="sub-h">Akun</div>
      <label class="check ${D.exclAcc?'on':''}" style="max-width:560px"><input type="checkbox" data-a="lis-exclacc" ${D.exclAcc?'checked':''}><span><b style="font-size:14px">Kecualikan akun yang diduga spam dan giveaway</b><span class="xs muted" style="display:block">Akun yang memposting teks identik lebih dari 20 kali sehari. Akun ini tetap terlihat di tab Jaringan, dengan tanda dikecualikan.</span></span></label>
      <div class="snote">Estimated noise removed: <b>sekitar 18%</b> dari post yang cocok dalam 30 hari terakhir.</div>
      <div class="wz-foot"><button class="btn" data-a="lis-step" data-s="3">Kembali</button><button class="btn primary" data-a="lis-step" data-s="5">Lanjut</button></div>`;
  } else if(L.step===5){
    b=`<h2 style="margin-bottom:2px">Sumber &amp; jadwal</h2><p class="small muted" style="margin:0 0 12px">Pilih sumber yang dipantau. Setiap sumber punya riwayat dan metadata berbeda, ditampilkan di sini agar hasilnya dibaca dengan tepat.</p>
      <div class="grid g2" style="gap:8px">${LIS_PLATS.map(([k,n,d])=>`<label class="plat ${L.plats.has(k)?'on':''}"><input type="checkbox" data-a="lis-plat" data-k="${k}" ${L.plats.has(k)?'checked':''}>${platIc(k)}<span><b style="font-size:14px">${n}</b><span class="xs muted" style="display:block">${d}</span></span></label>`).join('')}</div>
      <div class="coverage" style="margin-top:12px">${ic('info')}<span>Berita diukur dalam artikel dan media sosial dalam post. Keduanya ditampilkan berdampingan tetapi tidak pernah dijumlahkan. Sekitar 61% post media sosial memiliki data lokasi yang bisa dipakai.</span></div>
      <div class="sub-h">Bagaimana monitor ini diperbarui?</div>
      <div class="row" style="align-items:stretch">
        <div role="button" tabindex="0" class="mode-opt ${L.mode==='demand'?'sel':''}" data-a="lis-mode" data-m="demand"><span class="r"></span><span><b>Sesuai permintaan</b><span class="small muted" style="display:block">Pemantauan dan analisis hanya berjalan saat Anda menekan Perbarui.</span></span></div>
        <div role="button" tabindex="0" class="mode-opt ${L.mode==='always'?'sel':''}" data-a="lis-mode" data-m="always"><span class="r"></span><span><b>Selalu memantau</b><span class="small muted" style="display:block">Berjalan sesuai jadwal${L.mode==='always'?`: <select class="select" style="width:auto;display:inline-block;padding:2px 6px;font-size:12.5px" data-bind="lis-interval">${['Setiap 6 jam','Setiap 12 jam','Harian','Mingguan'].map(o=>`<option ${L.interval===o?'selected':''}>${o}</option>`).join('')}</select>`:'.'}</span></span></div>
      </div>
      <div class="wz-foot"><button class="btn" data-a="lis-step" data-s="4">Kembali</button><button class="btn primary" data-a="lis-step" data-s="6" ${L.plats.size?'':'disabled'}>Tinjau</button></div>`;
  } else {
    const on=D.clusters.filter(c=>c.on);
    b=`<h2 style="margin-bottom:14px">Tinjau pengaturan monitor</h2>
      <dl class="kv" style="margin-bottom:16px"><dt>Nama monitor</dt><dd><b>${esc(D.name)}</b></dd><dt>Mengukur</dt><dd>${esc(D.goal)}</dd><dt>Klaster kata kunci</dt><dd>${on.length} klaster, ${activeTerms(D.clusters)} active terms</dd><dt>Pengecualian</dt><dd>${D.excl.length} rules${D.exclAcc?' + akun spam':''}</dd><dt>Sumber</dt><dd>${[...L.plats].map(k=>PLAT[k].n).join(', ')}</dd><dt>Bahasa</dt><dd>${[...D.langs].join(', ')}</dd><dt>Periode</dt><dd>${esc(D.period)}</dd><dt>Pembaruan</dt><dd>${L.mode==='always'?'Selalu memantau, '+L.interval.toLowerCase():'Sesuai permintaan'}</dd></dl>
      <div class="health"><div><div class="l">Cakupan historis</div><div class="v">Tinggi</div></div><div><div class="l">Data lokasi</div><div class="v" style="color:var(--ev-unverified)">Sebagian</div></div><div><div class="l">Tingkat noise</div><div class="v" style="color:var(--ev-unverified)">Sedang</div></div><div><div class="l">Perkiraan hasil pertama</div><div class="v">2–4 min</div></div></div>
      <div class="wz-foot"><button class="btn" data-a="lis-step" data-s="5">Kembali untuk mengubah</button><div class="row"><button class="btn" data-a="toast" data-m="Draf tersimpan.">Simpan sebagai draf</button><button class="btn primary" data-a="lis-run">▶ Mulai memantau</button></div></div>`;
  }
  return `<div class="wz"><div class="wz-head"><div><div class="layer-tag">Discover · Kesadaran isu</div><h1>Buat monitor</h1></div><button class="btn" data-a="lis-home">✕ Batal</button></div>${wizProgress(LIS_STEPS, L.step, 'lis-step')}<div class="wz-card">${b}</div></div>`;
}

const LTABS = [['overview','Ringkasan'],['trends','Tren'],['sentiment','Sentimen & emosi'],['issues','Isu & suara'],['geo','Geografi'],['network','Network'],['content','Konten']];
function lisInsight(){
  const L=S.lis, m=L.monitors.find(x=>x.id===L.ws)||L.monitors[0];
  if(m.id!=='nikel') return `<div class="wrap"><button class="btn sm ghost" data-a="lis-home">Semua monitor</button><div class="card" style="margin-top:12px"><div class="empty"><h3>Data contoh hanya tersedia untuk “Hilirisasi Nikel & Teluk Buli”</h3><button class="btn dark" data-a="open-listening" data-ws="nikel">Buka monitor tersebut</button></div></div></div>`;
  const totS = Object.values(LTOT).reduce((a,b)=>a+b,0), totE = Object.values(LENG).reduce((a,b)=>a+b,0);
  let b='';
  if(L.tab==='overview'){
    b=`<div class="card accent-l"><div class="card-h"><h3>Ringkasan</h3>${ev('ai','Ringkasan AI')}</div>
        <p class="snap-head">Percakapan publik tentang dugaan limbah smelter di Teluk Buli naik empat kali lipat pada Oktober, didorong video viral dan testimoni nelayan. Media sosial didominasi sentimen negatif, sementara pemberitaan umumnya netral dan berfokus pada pengambilan sampel resmi serta gugatan.</p>
        <div class="kp">X menyumbang 63% mention media sosial, tetapi TikTok menghasilkan engagement terbanyak (49%), sebagian besar dari testimoni nelayan.</div>
        <div class="kp">Sentimen negatif memuncak pada 6 Okt (62% post terklasifikasi), hari ketika investigasi Majalah Tempo terbit.</div>
        <div class="kp">Marah adalah emosi dominan (34%); rasa takut meningkat setelah gugatan, terkait keamanan ikan untuk dikonsumsi.</div>
        <div class="kp">Percakapan terkonsentrasi di Maluku Utara dan Jakarta; 39% post tidak memiliki lokasi yang andal.</div>
        <p class="xs muted" style="margin:10px 0 0">Sentimen media sosial mencerminkan orang yang memposting di platform ini, bukan seluruh opini publik. Sentimen tidak mengonfirmasi apa yang terjadi.</p></div>

function topicCard(k,t){

function bcIssues(D){
  const F=S.bc.f; const rk={High:3,Medium:2,Low:1};

  list.sort((a,b)=>F.sort==='Materiality'?rk[b[1].risk]-rk[a[1].risk]:F.sort==='Sources'?b[1].n-a[1].n:b[1].upd.localeCompare(a[1].upd));
  const cats=['All',...new Set(Object.values(D.topics).map(t=>t.cat))], sts=['All',...new Set(Object.values(D.topics).map(t=>t.status))];
  return `<div class="card"><div class="filters"><input class="input" placeholder="🔍 Cari klaster topik" value="${esc(F.q)}" data-bind="bc-fq" aria-label="Cari topik">

function bcTopic(D){

function vWatch(){
  const W = S.wl;
  const tabs=[['updates','Pembaruan'],['following','Following'],['saved','Saved']];
  let b='';
  if(W.sel){
    const u = UPDATES.find(x=>x.id===W.sel);
    b=`<button class="btn sm ghost" data-a="wl-sel" data-id="" style="margin-bottom:10px">Semua pembaruan</button>
      <div class="panel"><div class="panel-h"><div><div class="xs muted">${ITEMS[u.item].k} · ${u.when}</div><h2>${ITEMS[u.item].n}</h2></div>${sf(u.item,true)}</div><div class="panel-b">
      <div class="row" style="margin-bottom:10px">${ev(u.ev)}<b>${u.type}</b></div>
      <h3 style="margin-bottom:14px">Apa yang berubah</h3>
      <div class="diff"><div><div class="xs muted">Sebelum</div>${u.before}</div><div class="after"><div class="xs" style="color:var(--red);font-weight:600">Sekarang</div>${u.after}</div></div>
      <p class="small" style="margin:14px 0 6px"><b>Mengapa Anda melihat ini:</b> ${u.mat}</p>
      <div class="row" style="margin-top:12px"><button class="btn" data-a="src" data-id="${u.src}">${ic('doc',14)}Lihat sumber</button><button class="btn dark" data-a="${u.item==='e:hendra'?'to-quotes':u.item==='i:telukbuli'?'sm-open':'network-rel'}" data-sp="Hendra Wiratama">Buka di ${u.item==='e:hendra'?'Quotes':u.item==='i:telukbuli'?'Issue Analysis':'Network Explorer'}</button></div>
      <p class="xs muted" style="margin:14px 0 0">Terakhir diperiksa 13 Okt 2026, 07:30 WIB.</p></div></div>`;
  } else if(W.tab==='updates'){
    const ups = UPDATES.filter(u=>S.followed.has(u.item));
    b = ups.length ? `<div class="panel"><ul class="list" style="padding:0 18px">${ups.map(u=>`<li class="item clickrow" data-a="wl-sel" data-id="${u.id}"><span style="width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:${u.read?'transparent':'var(--red)'}"></span><div class="grow"><div class="row xs muted" style="gap:8px"><b style="color:var(--ink)">${ITEMS[u.item].n}</b><span>${u.when}</span></div><h4>${u.text}</h4><div class="row" style="gap:6px">${ev(u.ev)}<span class="xs muted">${u.type}</span></div></div></li>`).join('')}</ul></div>
      <p class="xs muted" style="margin-top:10px">Hanya perubahan material yang muncul di sini. Artikel baru yang sekadar menyebut item tidak memicu pembaruan.</p>`
      : `<div class="panel"><div class="empty"><h3>Tidak ada pembaruan</h3><p class="small muted">Tidak ada perubahan material pada item yang Anda ikuti sejak terakhir diperiksa (07:30 WIB).</p></div></div>`;
  } else {
    const set = W.tab==='following' ? S.followed : S.saved;
    const keys = [...set];
    b = keys.length ? `<div class="panel scroll-x"><table class="t"><thead><tr><th>Item</th><th>Tipe</th><th>Dari</th><th>${W.tab==='following'?'Alerts':''}</th><th></th></tr></thead><tbody>${keys.map(k=>`<tr><td><b>${ITEMS[k].n}</b></td><td class="small">${ITEMS[k].k}</td><td class="small muted">${ITEMS[k].from}</td><td>${W.tab==='following'?`<select class="select" style="width:auto;padding:4px 8px;font-size:13px" data-a="wl-freq" aria-label="Frekuensi notifikasi"><option>Seketika</option><option selected>Ringkasan harian</option><option>Ringkasan mingguan</option><option>Dibisukan</option></select>`:''}</td><td style="text-align:right">${sf(k,true)}</td></tr>`).join('')}</tbody></table></div>`
      : `<div class="panel"><div class="empty"><h3>${W.tab==='following'?'Belum mengikuti apa pun':'Belum ada yang disimpan'}</h3><p class="small muted">${W.tab==='following'?'Ikuti entitas, isu, atau monitor untuk mendapat pembaruan saat ada perubahan material.':'Simpan jawaban, kutipan, graph, dan laporan agar bisa ditemukan di sini nanti.'}</p></div></div>`;
  }
  return `<div class="wrap"><div class="page-head"><div><div class="layer-tag">My Workspace</div><h1>Watchlist &amp; Alerts</h1><p class="lede">Semua yang Anda simpan atau ikuti di Tempo Signal. <b>Simpan</b> menyimpan salinan untuk nanti. <b>Ikuti</b> memberi tahu Anda saat ada perubahan material.</p></div></div>
    ${W.sel?'':`<div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${W.tab===k?'on':''}" data-a="wl-tab" data-t="${k}">${l} <span class="xs muted">${k==='updates'?UPDATES.filter(u=>S.followed.has(u.item)).length:k==='following'?S.followed.size:S.saved.size}</span></button>`).join('')}</div>`}
    ${b}</div>`;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, d = el.dataset;
  if(e.target.closest('select') || (el.tagName==='SELECT')) return;
  switch(a){
    case 'go': if(d.v==='watchlist'){S.wl.sel=null} if(d.v==='listening'){S.lis.stage='home'} if(d.v==='signal'){S.sm.stage='home'} go(d.v); break;
    case 'menu': $('#side').classList.add('open'); $('#scrim').classList.add('show'); break;
    case 'close': closeAll(); break;
    case 'theme': { const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark?'light':'dark'; break; }
    case 'toast': toast(d.m); break;
    case 'src': openDrawer(d.id); break;
    case 'first-use': S.firstUse = el.checked; rerender(); break;
    case 'dismiss': S.dismissed.add(d.id); toast('Saran diabaikan. Kami akan lebih jarang menampilkan saran serupa.'); rerender(); break;
    case 'save': { const k=d.k; if(S.saved.has(k)){S.saved.delete(k);toast('Dihapus dari simpanan.')} else {S.saved.add(k);toast('Disimpan ke Watchlist Anda. Anda tidak akan menerima notifikasi kecuali mengikutinya.')} rerender(); break; }
    case 'follow': { const k=d.k; if(S.followed.has(k)){S.followed.delete(k);toast('Berhenti mengikuti. Item yang disimpan tetap ada di pustaka Anda.')} else {S.followed.add(k);toast('Diikuti. Anda akan menerima pembaruan saat ada perubahan material.')} rerender(); break; }
    case 'open-update': S.wl.sel=d.id; UPDATES.find(x=>x.id===d.id).read=true; go('watchlist'); break;
    case 'wl-tab': S.wl.tab=d.t; rerender(); break;
    case 'wl-sel': S.wl.sel=d.id||null; if(d.id) UPDATES.find(x=>x.id===d.id).read=true; rerender(); break;
    default: if(ACT[a]) ACT[a](el,d);
  }
});
document.addEventListener('change', e => {
  if(e.target.tagName==='SELECT' && e.target.dataset.a && ACT[e.target.dataset.a]) { ACT[e.target.dataset.a](e.target, e.target.dataset); return; }
  if(e.target.dataset.a==='wl-freq') toast('Frekuensi notifikasi diatur ke '+e.target.value.toLowerCase()+'.');
});
document.addEventListener('input', e => {
  const b = e.target.dataset.bind; if(!b) return;
  if(BIND[b]) { BIND[b](e.target.value); return; }
  if(b==='sm-target') S.sm.ctx.target=e.target.value;
  if(b==='bc-q') S.bc.query=e.target.value;
  if(b==='bc-ctx') S.bc.context=e.target.value;
});
document.addEventListener('submit', e => {
  const f = e.target.dataset.form; if(!f) return; e.preventDefault();
  const fd = new FormData(e.target);
  if(f==='hero-ask'){ const q=fd.get('q')||'Apa kontroversi PT Nusantara Energi Raya?'; askNew(); askSubmit(q); }
  if(f==='ask'){ askSubmit(fd.get('q')||''); }
  if(f==='quotes'){ qSearch(fd.get('q')); }
  if(f==='rm-search'){ S.rm.q=(fd.get('q')||'').trim(); S.rm.searched=!!S.rm.q; S.rm.pick=null; rerender(); }
  if(f==='cp-search'){ const k=e.target.dataset.k, X=S.cp.form[k]; X.q=(fd.get('q')||'').trim(); X.searched=!!X.q; X.id=null; rerender(); }
  if(f==='sk-search'){ const q=(fd.get('q')||'').trim(); if(!q) return; S.sk.q=q; S.sk.pick=null; const h=skSearch(q,S.sk.type).hits; if(h.length===1) S.sk.pick=h[0].id; S.sk.stage='confirm'; S.nx.mode='issue'; go('network'); }
  if(f==='bc-ask'){ toast('Jawaban lanjutan hanya memakai sumber laporan ini (prototipe).'); e.target.reset(); }
  if(f==='monitor'){
    const n=fd.get('n').trim(); if(!n) return;
    const id='m'+Date.now(); S.lis.monitors.push({id, n, inc:(fd.get('inc')||n).split(',').map(s=>s.trim()).filter(Boolean), exc:(fd.get('exc')||'').split(',').map(s=>s.trim()).filter(Boolean), src:fd.getAll('src'), period:'30 hari terakhir', vol:'Mengumpulkan', chg:'New'});
    ITEMS['m:'+id]={n, k:'Monitor Listening', from:'News & Social Listening'};
    closeAll(); S.lis.ws=null; S.firstUse=false; go('listening'); toast('Monitor dibuat. Hasil pertama biasanya muncul dalam satu jam.');
  }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape') closeAll();
  if(e.key==='Enter' && e.target.dataset && e.target.dataset.enter && ACT[e.target.dataset.enter]){ e.preventDefault(); ACT[e.target.dataset.enter](e.target, e.target.dataset); return; }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('g[data-a],circle[data-a],[role=button][data-a]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
});
$('#gsearch').addEventListener('keydown', e => { if(e.key==='Enter' && e.target.value.trim()){ askNew(); askSubmit(e.target.value); e.target.value=''; } });
