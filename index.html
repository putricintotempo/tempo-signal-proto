function skSearch(q, type){
  q=q.trim().toLowerCase(); if(!q) return {hits:[], other:[]};
  const all=[...Object.entries(SKOBJ).map(([id,o])=>({id,...o})), ...SKDECOY];
  const words=q.split(/\s+/).filter(w=>w.length>2);
  const m = all.filter(o=>[o.n,...(o.al||[])].some(x=>{ x=x.toLowerCase(); return x.includes(q)||words.some(w=>x.includes(w)); }));
  return {hits:m.filter(o=>o.type===type), other:m.filter(o=>o.type!==type)};
}
/* hasil analisis untuk scope aktif (sebelum filter halaman hasil) */
function skAnalyse(r){
  const o=SKOBJ[r.o], sc=r.sc, maxLv = sc.depth==='direct'?1:3;
  const inYears = t => !t || (t[1]>=sc.y0 && t[0]<=sc.y1);
  const rels = o.rels.filter(x=>inYears(x.t));
  const nodeOK = n => n.ctx || n.lv<=maxLv;
  let ids = new Set(['OBJ', ...o.nodes.filter(nodeOK).map(n=>n.id)]);
  // hanya simpan relasi antar node yang lolos; node tanpa relasi dalam periode dibuang
  let R = rels.filter(x=>ids.has(x.a)&&ids.has(x.b));
  const linked = new Set(['OBJ']); let grew=true;
  while(grew){ grew=false; R.forEach(x=>{ if(linked.has(x.a)&&!linked.has(x.b)){linked.add(x.b);grew=true;} if(linked.has(x.b)&&!linked.has(x.a)){linked.add(x.a);grew=true;} }); }
  ids = new Set([...ids].filter(id=>linked.has(id)));
  R = R.filter(x=>ids.has(x.a)&&ids.has(x.b));
  const outside = o.nodes.filter(n=>!n.ctx && n.lv>maxLv);
  return {o, sc, ids, rels:R, nodes:o.nodes.filter(n=>ids.has(n.id)), outside};
}
function skPath(D,id){ // jalur terpendek dari objek utama ke node
  const prev={OBJ:null}, q=['OBJ'];
  while(q.length){ const c=q.shift(); D.rels.forEach(r=>{ const n = r.a===c?r.b:r.b===c?r.a:null; if(n&&!(n in prev)){ prev[n]={from:c, r}; q.push(n); } }); }
  if(!(id in prev)) return null; const steps=[]; let c=id; while(prev[c]){ steps.unshift(prev[c].r); c=prev[c].from; } return steps;
}

const cpIsEndpointType = t => t==='Person'||t==='Organization';
function cpAnalyse(run){
  const sc=run.sc, A=run.a, B=run.b, H=sc.hop;
  const P = sc.all ? null : [sc.y0, sc.y1];
  const inP = e => !P || !e.t || (e.t[1]>=P[0] && e.t[0]<=P[1]);
  const edges = CPE.filter(e=>inP(e));
  const adj = {}; edges.forEach(e=>{ (adj[e.a]=adj[e.a]||[]).push([e,e.b]); (adj[e.b]=adj[e.b]||[]).push([e,e.a]); });
  const out=[]; let limitHit=false;
  const dfs=(node,vis,path)=>{ if(path.length>H) return; if(node===B&&path.length){ out.push(path.slice()); return; } if(out.length>=60){ limitHit=true; return; }
    (adj[node]||[]).forEach(([e,nx])=>{ if(vis.has(nx)) return; const t=NN[nx].t; if(t==='Location') return; if(nx!==B && path.length+1>=H) return; if(nx!==B && !['Person','Organization','Program','Project','Issue','Case'].includes(t)) return; vis.add(nx); path.push(e); dfs(nx,vis,path); path.pop(); vis.delete(nx); }); };
  dfs(A,new Set([A]),[]);
  let paths = out.map(es=>{ const nodes=[A]; es.forEach(e=>nodes.push(e.a===nodes[nodes.length-1]?e.b:e.a));
    const claim = es.some(e=>e.st!=='fact'), unk = es.some(e=>!e.t);
    let shared=null; if(!unk){ let lo=Math.max(...es.map(e=>e.t[0])), hi=Math.min(...es.map(e=>e.t[1])); if(P){ lo=Math.max(lo,P[0]); hi=Math.min(hi,P[1]); } if(lo<=hi) shared=[lo,hi]; }
    const grp = claim?'claim':unk?'unk':shared?'main':'hist';
    const mids=nodes.slice(1,-1); const locs=new Set(); nodes.concat(es.map(e=>e.ctx).filter(Boolean)).forEach(n=>CPLOC.filter(l=>l[0]===n&&l[1]).forEach(l=>locs.add(l[1])));
    return {nodes, edges:es, hops:es.length, grp, shared, mids, locs, srcs:[...new Set(es.flatMap(e=>e.src))]}; });
  if(sc.loc){ const keep=[], drop=[]; paths.forEach(p=>(p.locs.has(sc.loc)?keep:drop).push(p)); run._locDrop=drop.length; paths=keep; } else run._locDrop=0;
  const objScore = p => sc.obj==='aff' ? (p.edges.some(e=>['role','own'].includes(e.k))?1:0)+(p.hops===1?1:0) : sc.obj==='via' ? (p.mids.some(m=>cpIsEndpointType(NN[m].t))?1:0) : (p.mids.some(m=>['Program','Project','Issue','Case'].includes(NN[m].t))?1:0);
  const order={main:0,hist:1,unk:2,claim:3};
  paths.sort((x,y)=> order[x.grp]-order[y.grp] || objScore(y)-objScore(x) || x.hops-y.hops || x.edges.map(e=>e.id).join().localeCompare(y.edges.map(e=>e.id).join()));
  paths = paths.slice(0,20);
  paths.forEach((p,i)=>{ p.id='J'+(i+1); p.match=objScore(p)>0;
    const r=[`${p.hops} hubungan`]; if(p.match) r.push({aff:'sesuai fokus afiliasi',via:'perantara orang/organisasi',ctx:'melalui konteks bersama'}[sc.obj]); if(p.grp==='main') r.push('waktu hubungan beririsan'); if(p.grp==='hist') r.push('waktu tidak beririsan'); if(p.grp==='unk') r.push('waktu belum pasti'); if(p.grp==='claim') r.push('memuat klaim belum terverifikasi'); p.reason=r.join('; '); });
  const co = CPCOMENTION.filter(c=>(c[0]===A&&c[1]===B)||(c[0]===B&&c[1]===A));
  return {paths, limitHit, co, direct:paths.filter(p=>p.hops===1&&p.grp==='main'), unkLocCtx: CPLOC.filter(l=>!l[1]).map(l=>l[0])};
}
const cpName = id => NN[id] ? NN[id].n : id;
const cpYr = t => !t ? null : t[0]===t[1] ? ''+t[0] : `${t[0]} – ${t[1]}`;
const cpStep = e => `${cpName(e.a)} ${e.l} ${cpName(e.b)}`;
function cpExplain(p){
  const steps=p.edges.map(e=>`${cpStep(e)} (${e.t?(e.ev==='event'?'peristiwa ':'')+cpYr(e.t):'waktu belum diketahui'})`);
  return steps.join('; ')+'.';
}
function cpCannot(p,run){
  const A=cpName(run.a), B=cpName(run.b), mt=p.mids.map(m=>NN[m].t), ks=p.edges.map(e=>e.k), out=[];
  if(p.hops>1) out.push(`Jalur ini tidak menunjukkan hubungan langsung antara ${A} dan ${B}.`);
  if(mt.includes('Case')) out.push('Peran berbeda dalam kasus yang sama tidak menunjukkan kerja sama atau kesalahan bersama.');
  if(mt.includes('Program')||mt.includes('Project')) out.push('Keterlibatan pada konteks yang sama tidak menunjukkan pengawasan langsung atau kontrak antara kedua pihak, kecuali sumber menyatakannya.');
  if(ks.includes('role')&&ks.includes('contract')) out.push(`Tidak membuktikan orang dalam jalur ini menjadi pihak dalam kontrak atau memiliki kepentingan pribadi.`);
  if(ks.filter(k=>k==='role').length>=2&&p.mids.length===1&&!mt.includes('Case')) out.push('Afiliasi pada organisasi yang sama tidak membuktikan keduanya saling kenal atau bekerja bersama.');
  if(ks.includes('money')) out.push('Pendanaan kepada organisasi tidak berarti pendana terlibat dalam kegiatan pihak lain.');
  if(p.hops>1&&p.edges.some(e=>e.ev==='event')) out.push('Waktu peristiwa hanya diketahui pada resolusi tahun; tidak membuktikan kedua peran terjadi pada saat yang sama.');
  if(ks.includes('own')) out.push('Klaim kepemilikan belum terverifikasi; tidak membuktikan kepemilikan atau pengendalian.');
  return out;
}

/* ---------- hasil ---------- */
function cpFilterPaths(R,run){
  const F=S.cp.f; return R.paths.filter(p=>{
    if(F.hop!=='Semua'&&p.hops!==+F.hop) return false;
    if(F.it.length && !p.mids.some(m=>F.it.includes(NN[m].t))) return false;
    if(F.rel.length && !p.edges.some(e=>F.rel.includes(e.l))) return false;
    if(F.loc!=='Semua' && !p.locs.has(F.loc)) return false;
    if(F.grp!=='Semua' && p.grp!==F.grp) return false;
    if(F.y0!=null){ if(p.edges.some(e=>e.t&&(e.t[1]<F.y0||e.t[0]>F.y1))) return false; }
    return true; });
}
function cpResult(){
  const K=S.cp, run=K.runs.find(r=>r.id===K.cur), R=cpAnalyse(run), sc=run.sc;
  if(!K.f) K.f=cpNewF();
  const FP=cpFilterPaths(R,run);
  if(!K.act || !FP.find(p=>p.id===K.act)){ const prev=K.act; K.act = (FP.find(p=>p.grp==='main')||FP[0]||{}).id||null; if(prev&&prev!==K.act){ K.sel=null; K.note='Jalur yang dipilih tidak lagi sesuai filter; menampilkan jalur teratas yang tersisa.'; } }
  K.cmp = K.cmp.filter(id=>FP.find(p=>p.id===id));
  const head = `<div class="sk-head"><div style="min-width:0"><div class="xs muted">Analisis dibuat ${run.when} · data per ${CPDATE} · snapshot</div><h2 style="margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="cp-end">A</span>${cpName(run.a)} ${cpTP(NN[run.a].t)} <span class="muted">↔</span> <span class="cp-end b">B</span>${cpName(run.b)} ${cpTP(NN[run.b].t)}</h2>
      <div class="row" style="gap:6px;margin-top:8px"><span class="qb-op">📅 ${cpPerL(sc)}</span><span class="qb-op">🔗 ${sc.hop} · ${cpHopL(sc.hop)}</span><span class="qb-op">📍 ${cpLocName(sc.loc)}</span><span class="qb-op" style="background:var(--red-tint);color:var(--red);font-weight:600">🎯 ${CPOBJ[sc.obj][0]}</span></div></div>
      <div class="row" style="gap:6px"><button class="btn sm" data-a="cp-edit">✎ Ubah scope (analisis baru)</button><button class="btn sm primary" data-a="cp-new">${ic('plus',13)}Analisis baru</button></div></div>`;
  const partial = run.status==='Parsial' ? `<div class="sk-note" style="border-left:3px solid var(--ev-unverified);margin-top:12px"><b>Hasil parsial.</b> Pencarian berhenti pada batas waktu sebelum semua kandidat diperiksa. Jalur di bawah adalah yang ditemukan sejauh ini, bukan hasil lengkap. <button class="btn sm" data-a="cp-retry" style="margin-left:6px">Coba lagi</button></div>` : '';
  if(!R.paths.length) return cpCrumb(`${cpName(run.a)} ↔ ${cpName(run.b)}`,'← Riwayat') + head + partial + `<div class="card"><div class="empty"><h3>Belum ditemukan jalur dalam sumber dan scope ini</h3><p class="small muted" style="max-width:60ch;margin:0 auto 10px">Ini tidak berarti kedua pihak tidak pernah berhubungan. Jalur mungkin tidak diberitakan, berada di luar periode atau lokasi, atau membutuhkan lebih banyak hubungan.${R.co.length?` ${R.co[0][2]} artikel menyebut keduanya bersama tanpa menyatakan hubungan; penyebutan bersama tidak membentuk hubungan.`:''}${run._locDrop?` ${run._locDrop} jalur ditemukan tetapi tidak memenuhi filter lokasi.`:''}</p>
      <div class="row" style="justify-content:center;gap:6px">${!sc.all?'<button class="btn sm" data-a="cp-widen" data-w="all">Analisis baru: semua periode</button>':''}${sc.hop<3?'<button class="btn sm" data-a="cp-widen" data-w="hop">Analisis baru: maks. 3 hubungan</button>':''}${sc.loc?'<button class="btn sm" data-a="cp-widen" data-w="loc">Analisis baru: tanpa batas lokasi</button>':''}<button class="btn sm" data-a="cp-edit">Ubah nama atau scope</button></div></div></div>`;
  return cpCrumb(`${cpName(run.a)} ↔ ${cpName(run.b)}`,'← Riwayat') + head + partial + cpSummary(R,run) + cpFilters(R,run,FP) + (K.note?`<div class="sk-note" role="status">${K.note}</div>`:'') + cpWorkspace(R,run,FP);
}
function cpSummary(R,run){
  const A=cpName(run.a), B=cpName(run.b), g=k=>R.paths.filter(p=>p.grp===k).length, main=R.paths.filter(p=>p.grp==='main');

  const finds = (main.length?main:R.paths).slice(0,3).map(p=>`<li>${main.length?'':'<span class="sk-gt">'+CPGRP[p.grp][0]+'</span> '}<button class="linkish" data-a="cp-path" data-id="${p.id}" style="font-weight:700">${p.id}</button> ${p.hops===1?`${cpStep(p.edges[0])}.`:`${A} dan ${B} terhubung melalui ${p.mids.map(cpName).join(' dan ')}: ${p.edges.map(cpStep).join('; ')}.`} ${p.shared?`Periode bersama: ${cpYr(p.shared)}.`:''} ${cpCite(p.srcs)}</li>`).join('');
  const roleContract = main.find(p=>p.edges.some(e=>e.k==='role')&&p.edges.some(e=>e.k==='contract'));
  const lims=[];
  if(R.co.length) lims.push(`${R.co[0][2]} artikel menyebut ${A} dan ${B} bersama tanpa menyatakan hubungan; tidak dijadikan hubungan ${cpCite([R.co[0][3]])}`);
  if(g('claim')) lims.push(`${g('claim')} jalur memuat klaim belum terverifikasi atau dibantah; ditampilkan terpisah dan tidak dihitung sebagai jalur utama`);
  if(g('unk')) lims.push(`${g('unk')} jalur memuat hubungan dengan waktu yang belum diketahui; tanggal publikasi tidak dipakai sebagai waktu hubungan`);
  if(g('hist')) lims.push(`${g('hist')} jalur terdiri dari hubungan pada periode berbeda; tidak membuktikan keterlibatan bersamaan`);
  if(run._locDrop) lims.push(`${run._locDrop} jalur tidak memenuhi filter lokasi (lokasi konteks tidak diketahui atau di luar wilayah)`);
  lims.push(`Jumlah jalur adalah yang ditemukan dalam pencarian ini (maks. 20 disimpan), bukan seluruh kemungkinan hubungan`);
  const filtered = Object.entries(S.cp.f).some(([k,v])=>Array.isArray(v)?v.length:(v!=='Semua'&&v!=null));
  return `<div class="card accent-l" style="margin-top:12px"><div class="card-h"><h3>${filtered?'Ringkasan seluruh hasil analisis':'Ringkasan analisis'}</h3><span class="xs muted">${aiIc()} = interpretasi sistem</span></div>
    <p class="small" style="margin:0 0 8px">${dir} Ditemukan <b>${g('main')} jalur utama</b>${g('hist')?`, ${g('hist')} jalur pada periode berbeda`:''}${g('unk')?`, ${g('unk')} jalur dengan waktu belum pasti`:''}${g('claim')?`, dan ${g('claim')} jalur berisi klaim belum terverifikasi`:''}.</p>
    <div class="sk-sum"><section class="hl"><div class="l">Temuan utama</div><ul class="sk-ul">${finds}${roleContract?`<li class="ai">${aiIc()} Interpretasi sistem: perlu memeriksa apakah masa jabatan pada ${roleContract.id} beririsan dengan keputusan kontrak. Sumber tidak menyebut peran orang tersebut dalam kontrak. Ini bukan tuduhan kepentingan atau kolusi.</li>`:''}</ul></section>
    <section class="warn"><div class="l">Keterbatasan</div><ul class="sk-ul">${lims.map(l=>`<li>${l}.</li>`).join('')}</ul></section></div></div>`;
}
function cpFilters(R,run,FP){

      <label>Kelompok<select class="select" data-a="cp-fs" data-k="grp">${['Semua',...Object.keys(CPGRP)].map(v=>`<option value="${v}" ${F.grp===v?'selected':''}>${v==='Semua'?'Semua kelompok':CPGRP[v][0]}</option>`).join('')}</select></label>
      <label>Periode hasil<select class="select" data-a="cp-fy" data-k="y0"><option value="">Semua</option>${yrs.map(y=>`<option ${F.y0===y?'selected':''}>${y}</option>`).join('')}</select></label>

function cpWorkspace(R,run,FP){

      <div class="cp-alt" aria-label="Urutan jalur dalam teks">${paths.map(p=>`<div class="xs"><b>${p.id}:</b> ${[cpName(p.nodes[0]),...p.edges.map((e,i)=>`${e.a===p.nodes[i]?'→ '+e.l+' →':'← '+e.l+' ←'} ${cpName(p.nodes[i+1])}`)].join(' ')}</div>`).join('')}</div>

function cpCard(p,run){

function translateDom(root){
  if(!root) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n;
  while((n=w.nextNode())){ const raw=n.nodeValue, t=raw.trim(); if(!t||t.length>48) continue; const pe=n.parentElement; if(!pe||pe.closest('script,style')) continue;
    const r=trLabel(t); if(r===null||r===t) continue;

    n.nodeValue=raw.replace(t,r); }
  root.querySelectorAll('[title],[aria-label],[placeholder]').forEach(el=>['title','aria-label','placeholder'].forEach(a=>{ const v=el.getAttribute(a); const r=v&&trLabel(v.trim()); if(r) el.setAttribute(a,r); }));
}

/* ---------- insight per jalur ---------- */
function cpRoleOf(e,id){ const d=e.det||{}; return d['Peran / status']||d['Jabatan']||e.l; }
function cpInsight(p,run){
  const A=cpName(run.a), B=cpName(run.b), es=p.edges, ks=es.map(e=>e.k), mids=p.mids, mt=mids.map(m=>NN[m].t), sh=p.shared?cpYr(p.shared):null;
  if(p.grp==='claim'){ const c=es.find(e=>e.st!=='fact'); return `Jalur ini bergantung pada klaim “${cpStep(c)}” yang belum terverifikasi${c.alt?' dan telah dibantah':''}. Tampilkan sebagai konteks, jangan dijadikan dasar kesimpulan.`; }
  if(p.grp==='unk'){ const u=es.find(e=>!e.t); return `Waktu hubungan “${cpStep(u)}” belum diketahui, sehingga belum bisa dipastikan apakah hubungan-hubungan di jalur ini berlaku bersamaan.`; }
  if(p.hops===1){ const e=es[0]; return `${cpStep(e)} (${cpYr(e.t)}). Ini hubungan langsung yang dinyatakan sumber; tidak menunjukkan kepemilikan, kendali, atau eksklusivitas.`; }
  if(p.grp==='hist') return `Setiap hubungan memang ada, tetapi pada periode berbeda (${es.map(e=>cpYr(e.t)).join(' dan ')}). Jalur ini menjelaskan riwayat, bukan keterlibatan bersamaan.`;
  if(ks.includes('role')&&ks.includes('contract')){ const r=es.find(e=>e.k==='role'), c=es.find(e=>e.k==='contract'); return `${cpName(r.a)} menjabat ${(r.det['Jabatan']||'').toLowerCase()} di ${cpName(r.b)} (${cpYr(r.t)}) ketika ${cpName(c.a)} mengontrak ${cpName(c.b)} (${cpYr(c.t)}); irisan waktunya ${sh}. Relevan untuk pemeriksaan afiliasi pengadaan, tetapi tidak membuktikan ${cpName(r.a)} terlibat dalam keputusan kontrak.`; }
  if(mt.includes('Case')){ const x=mids[mt.indexOf('Case')]; const ea=es.find(e=>e.a===run.a||e.b===run.a), eb=es.find(e=>e.a===run.b||e.b===run.b); return `Keduanya disebut dalam ${cpName(x)} dengan peran berbeda: ${A} sebagai ${cpRoleOf(ea).toLowerCase()}, ${B} sebagai ${cpRoleOf(eb).toLowerCase()} (${sh}). Ini menjelaskan mengapa keduanya muncul di perkara yang sama; tidak menunjukkan kerja sama atau kesalahan bersama.`; }
  if(mt.includes('Program')||mt.includes('Project')){ const x=mids.find(m=>['Program','Project'].includes(NN[m].t)); const ea=es.find(e=>(e.a===run.a||e.b===run.a)), eb=es.find(e=>(e.a===run.b||e.b===run.b)); return `Keduanya punya peran berbeda pada ${cpName(x)}: ${A} ${ea.l}, ${B} ${eb.l}; periode bersama ${sh}. Menunjukkan konteks kerja yang sama, bukan kontrak langsung antara keduanya.`; }
  if(ks.filter(k=>k==='role').length===2&&mids.length===1) return `${A} dan ${B} sama-sama menjabat di ${cpName(mids[0])}; masa jabatannya beririsan ${sh}. Mungkin relevan sebagai jalur koordinasi, tanpa klaim keduanya saling kenal atau dapat memberi akses.`;
  if(ks.includes('money')){ const m=es.find(e=>e.k==='money'); return `${cpName(m.a)} ${m.l} ${cpName(m.b)} (${cpYr(m.t)}), yang terhubung dengan sisi lain pada periode ${sh}. Pendanaan kepada organisasi tidak berarti pendana terlibat dalam kegiatan pihak lain.`; }
  return `${A} dan ${B} terhubung melalui ${mids.map(cpName).join(' dan ')} pada periode ${sh}.`;
}
function cpRecs(R,run){
  const out=[], seen=new Set([run.a,run.b]), inPaths=new Set(R.paths.flatMap(p=>p.nodes));
  R.paths.filter(p=>p.grp!=='claim').forEach(p=>p.mids.forEach(m=>{
    const t=NN[m].t;
    if(['Program','Project','Issue','Case'].includes(t)){ if(seen.has(m)) return; seen.add(m); const side = p.edges.find(e=>(e.a===run.a&&e.b===m)||(e.b===run.a&&e.a===m)) ? run.a : run.b; out.push({k:'topic', id:m, txt:`${cpName(side)} terlibat pada ${cpName(m).toLowerCase().startsWith(skTL(t).toLowerCase())?'':skTL(t).toLowerCase()+' '}${cpName(m)}. Analisis ${cpName(m)} di Topic Network untuk melihat semua pihak dan perannya.`}); }
    else CPE.filter(e=>(e.a===m||e.b===m)&&e.st==='fact').forEach(e=>{ const c=e.a===m?e.b:e.a; if(seen.has(c)||inPaths.has(c)||!cpIsEndpointType(NN[c].t)) return; seen.add(c); out.push({k:'cp', a:run.a, b:c, txt:`${cpName(c)} juga ${e.a===c?e.l:'terhubung dengan'} ${cpName(m)}, perantara pada ${p.id}. Analisis Connection Paths antara ${cpName(run.a)} dan ${cpName(c)}.`}); });
  }));
  return out.slice(0,3);
}

/* ---------- hasil ---------- */
cpResult = function(){
  const K=S.cp, run=K.runs.find(r=>r.id===K.cur), R=cpAnalyse(run);
  if(!K.f) K.f=cpNewF();
  const FP=cpFilterPaths(R,run);
  if(K.act && !FP.find(p=>p.id===K.act)){ K.act=null; K.sel=null; K.note='Jalur yang dipilih tidak lagi sesuai filter.'; }
  const head = `<div class="sk-head"><div style="min-width:0"><div class="xs muted">Dibuat ${run.when} · data arsip Tempo per ${CPDATE}</div><h2 style="margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="cp-end">A</span>${cpName(run.a)} ${cpTP(NN[run.a].t)} <span class="muted">↔</span> <span class="cp-end b">B</span>${cpName(run.b)} ${cpTP(NN[run.b].t)}</h2></div>
      <div class="row" style="gap:6px"><button class="btn sm" data-a="cp-swaprun" title="Tukar posisi A dan B">⇄ Tukar A–B</button><button class="btn sm primary" data-a="cp-new">${ic('plus',13)}Analisis baru</button></div></div>`;
  const partial = run.status==='Parsial' ? `<div class="sk-note" style="border-left:3px solid var(--ev-unverified);margin-top:12px"><b>Hasil parsial.</b> Pencarian berhenti pada batas waktu sebelum semua kandidat diperiksa; jumlah jalur di bawah adalah yang ditemukan sejauh ini. <button class="btn sm" data-a="cp-retry" style="margin-left:6px">Coba lagi</button></div>` : '';
  if(!R.paths.length) return cpCrumb(`${cpName(run.a)} ↔ ${cpName(run.b)}`,'← Riwayat') + head + partial + `<div class="card"><div class="empty"><h3>Tidak ditemukan hubungan antara kedua objek</h3><p class="small muted" style="max-width:60ch;margin:0 auto 10px">Tidak ada hubungan langsung maupun tidak langsung (hingga 3 hubungan) dalam sumber yang dianalisis. Ini tidak berarti keduanya pasti tidak pernah berhubungan; hubungan itu mungkin tidak diberitakan.${R.co.length?` ${R.co[0][2]} artikel menyebut keduanya bersama tanpa menyatakan hubungan; penyebutan bersama tidak dihitung.`:''}</p><button class="btn sm" data-a="cp-new">Coba pasangan lain</button></div></div>`;
  return cpCrumb(`${cpName(run.a)} ↔ ${cpName(run.b)}`,'← Riwayat') + head + partial + cpSummary(R,run) + cpFilters(R,run,FP) + (K.note?`<div class="sk-note" role="status">${K.note}</div>`:'') + cpWorkspace(R,run,FP);
};
cpSummary = function(R,run){
  const A=cpName(run.a), B=cpName(run.b), g=k=>R.paths.filter(p=>p.grp===k).length, main=R.paths.filter(p=>p.grp==='main'), ind=main.filter(p=>p.hops>1);
  const mids=[...new Set(ind.flatMap(p=>p.mids))];
  let ans;
  if(R.direct.length) ans=`<b>Ditemukan hubungan langsung:</b> ${R.direct.map(p=>cpStep(p.edges[0])+' ('+cpYr(p.edges[0].t)+')').join('; ')}. ${ind.length?`Selain itu ada ${ind.length} jalur tidak langsung melalui ${mids.map(cpName).join(', ')}.`:''}`;
  else if(ind.length) ans=`<b>Tidak ditemukan hubungan langsung.</b> ${A} dan ${B} terhubung tidak langsung melalui <b>${mids.map(cpName).join(', ')}</b>. Penting diketahui karena jalur-jalur ini menunjukkan di mana kedua pihak bertemu: ${[...new Set(ind.map(p=>p.mids.map(m=>skTL(NN[m].t).toLowerCase()).join('/')))].join(', ')} yang sama, dengan waktu yang beririsan.`;
  else ans=`<b>Tidak ditemukan jalur utama</b> (hubungan dengan waktu beririsan). Yang ada hanya jalur pada periode berbeda, dengan waktu belum pasti, atau berisi klaim belum terverifikasi; lihat kelompok masing-masing di graph.`;
  const top=(main.length?main:R.paths).slice(0,3);
  const lims=[]; if(R.co.length) lims.push(`${R.co[0][2]} artikel menyebut ${A} dan ${B} bersama tanpa menyatakan hubungan; tidak dijadikan hubungan ${cpCite([R.co[0][3]])}.`);
  if(g('claim')) lims.push(`${g('claim')} jalur memuat klaim belum terverifikasi; ditandai terpisah dan tidak dihitung sebagai jalur utama.`);
  if(g('unk')) lims.push(`${g('unk')} jalur memuat hubungan tanpa waktu yang jelas; tanggal publikasi tidak dipakai sebagai waktu hubungan.`);
  if(g('hist')) lims.push(`${g('hist')} jalur terdiri dari hubungan pada periode berbeda.`);
  lims.push(`Jumlah jalur adalah yang ditemukan dalam pencarian ini (hingga 3 hubungan), bukan seluruh kemungkinan hubungan.`);
  const recs=cpRecs(R,run);
  const filtered = Object.entries(S.cp.f).some(([k,v])=>Array.isArray(v)?v.length:(v!=='Semua'&&v!=null));
  return `<div class="card accent-l" style="margin-top:12px"><div class="card-h"><h3>${filtered?'Ringkasan seluruh hasil analisis':'Ringkasan analisis'}</h3><span class="xs muted">${aiIc()} = interpretasi AI</span></div>
    <p class="xs muted" style="margin:0 0 6px">Scope: ${A} (${skTL(NN[run.a].t)}) ↔ ${B} (${skTL(NN[run.b].t)}) · semua periode tersedia · hingga 3 hubungan · arsip Tempo per ${CPDATE}</p>
    <p class="small" style="margin:0 0 8px">${ans} Total ${R.paths.length} jalur: ${g('main')} utama${g('hist')?`, ${g('hist')} periode berbeda`:''}${g('unk')?`, ${g('unk')} waktu belum pasti`:''}${g('claim')?`, ${g('claim')} klaim belum terverifikasi`:''}.</p>
    <div class="sk-sum"><section class="hl"><div class="l">Temuan penting</div><ul class="sk-ul">${top.map(p=>`<li><button class="linkish" data-a="cp-path" data-id="${p.id}" style="font-weight:700">${p.id}</button> <span class="cp-fact">${p.edges.map(cpStep).join('; ')}.</span> ${cpCite(p.srcs)}<div class="cp-ins">${aiIc()} ${cpInsight(p,run)}</div></li>`).join('')}</ul></section>
      <section class="warn"><div class="l">Keterbatasan</div><ul class="sk-ul">${lims.map(l=>`<li>${l}</li>`).join('')}</ul></section></div>
    ${recs.length?`<div class="cp-recs"><div class="l">Analisis lanjutan yang disarankan</div>${recs.map(r=>`<div class="cp-rec"><span class="small">${r.txt}</span>${r.k==='cp'?`<button class="btn sm" data-a="cp-rec" data-a1="${r.a}" data-b1="${r.b}">Analisis Connection Paths</button>`:`<button class="btn sm" data-a="cp-totopic" data-id="${r.id}">Buka di Topic Network</button>`}</div>`).join('')}</div>`:''}</div>`;
};
cpWorkspace = function(R,run,FP){

const CPGCOL = {main:'#1F4E8C', hist:'#8A8A8A', unk:'#555', claim:'#C98A1A'};
function cpLaneGraph(FP,run,R){
  const K=S.cp, sel=K.sel, act=K.act;
  const order=Object.keys(CPGRP), lanes=[]; order.forEach(gk=>FP.filter(p=>p.grp===gk).forEach(p=>lanes.push(p)));
  const W=960, xA=110, xB=W-110, laneH=94, gh=34; let y=34; const rows=[]; let lastG=null;
  lanes.forEach(p=>{ if(p.grp!==lastG){ rows.push({hdr:p.grp,y}); y+=gh; lastG=p.grp; } rows.push({p,y:y+laneH/2}); y+=laneH; });

  const markers=Object.entries(CPKCOL).map(([k,c])=>`<marker id="cpl-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`).join('');
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Semua jalur ${esc(cpName(run.a))} ke ${esc(cpName(run.b))}"><defs>${markers}<marker id="cpl-claim" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C98A1A"/></marker></defs><g class="vp">`;
  rows.forEach(r=>{ if(r.hdr) s+=`<text x="${xA+14}" y="${r.y+18}" class="cp-gtxt" fill="${CPGCOL[r.hdr]}">${CPGRP[r.hdr][0].toUpperCase()}</text><line x1="${xA+14}" y1="${r.y+24}" x2="${xB-14}" y2="${r.y+24}" stroke="var(--rule-2)"/>`; });
  const edgeSvg=(e,x1,y1,x2,y2,p,dim)=>{ const col=e.st!=='fact'?'#C98A1A':CPKCOL[e.k], dash=e.st!=='fact'?'7 4':!e.t?'2 3':'', on=sel&&sel.t==='e'&&sel.id===e.id&&K.act===p.id;
    const fwd = e.a===p.nodes[p.edges.indexOf(e)]; const [sx,sy,ex,ey]= fwd?[x1,y1,x2,y2]:[x2,y2,x1,y1];
    const onRail=x=>x===xA||x===xB; const dx=ex-sx, dy=ey-sy, L=Math.hypot(dx,dy)||1, rs=onRail(sx)?7:18, re=onRail(ex)?9:20; const a1=[sx+dx/L*rs, sy+dy/L*rs], a2=[ex-dx/L*re, ey-dy/L*re];
    const mx=(x1+x2)/2, my=(y1+y2)/2;
    return `<g class="nxe ${on?'sel':''} ${dim?'dim':''}" data-a="cp-edge" data-id="${e.id}" data-p="${p.id}" data-tip="${esc(cpStep(e)+'|'+(e.t?(e.ev==='event'?'Peristiwa ':'')+cpYr(e.t):'Waktu belum diketahui')+' · '+(e.st==='fact'?'dinyatakan sumber':'dugaan / dibantah'))}" tabindex="0" role="button" aria-label="${esc(p.id+': '+cpStep(e))}"><path d="M${a1[0]},${a1[1]} L${a2[0]},${a2[1]}" stroke="transparent" stroke-width="16"/><path d="M${a1[0]},${a1[1]} L${a2[0]},${a2[1]}" stroke="${col}" stroke-width="${on?3.6:2.2}" stroke-dasharray="${dash}" marker-end="url(#${e.st!=='fact'?'cpl-claim':'cpl-'+e.k})"/><rect x="${mx-62}" y="${my-24}" width="124" height="17" rx="3" fill="var(--paper)" opacity=".92"/><text x="${mx}" y="${my-12}" text-anchor="middle" class="cp-elab">${esc(e.l)} · ${e.t?cpYr(e.t):'waktu ?'}</text></g>`; };
  const nodeSvg=(id,x,y,p,dim)=>{ const t=NN[id].t, r=15, on=sel&&sel.t==='n'&&sel.id===id&&K.act===p.id, c=cnt[id]||0;
    return `<g class="nxn ${on?'sel':''} ${dim?'dim':''}" data-a="cp-node" data-id="${id}" data-p="${p.id}" data-tip="${esc(cpName(id)+'|'+skTL(t)+' · perantara'+(c>1?' · muncul di '+c+' jalur':''))}" tabindex="0" role="button" aria-label="${esc(cpName(id)+', '+skTL(t)+', perantara pada '+p.id)}">${skShape(t,x,y,r)}${skGlyph(t,x,y,r)}${on?`<circle cx="${x}" cy="${y}" r="${r+8}" fill="none" stroke="var(--red)" stroke-width="2"/>`:''}${c>1?`<g><rect x="${x+9}" y="${y-r-12}" width="22" height="14" rx="7" fill="var(--ink)"/><text x="${x+20}" y="${y-r-2}" text-anchor="middle" fill="var(--paper)" font-size="9.5" font-weight="800">×${c}</text></g>`:''}<text x="${x}" y="${y+r+15}" text-anchor="middle" class="nxl">${esc(cpName(id).length>26?cpName(id).slice(0,24)+'…':cpName(id))}</text><text x="${x}" y="${y+r+27}" text-anchor="middle" class="nxs">${skTL(t)}</text></g>`; };
  rows.filter(r=>r.p).forEach(r=>{ const p=r.p, dim=act&&act!==p.id, ly=r.y, n=p.nodes.length;
    const xs=p.nodes.map((_,i)=>i===0?xA:i===n-1?xB:xA+(xB-xA)*i/(n-1)), ys=p.nodes.map(()=>ly);

    } else {
      p.edges.forEach((e,i)=>{ s+=edgeSvg(e,xs[i],ys[i],xs[i+1],ys[i+1],p,dim); });
      p.nodes.slice(1,-1).forEach((id,i)=>{ s+=nodeSvg(id,xs[i+1],ly,p,dim); });
    }
    s+=`<circle cx="${xA}" cy="${ly}" r="5" fill="var(--ink)" class="${dim?'dim':''}"/><circle cx="${xB}" cy="${ly}" r="5" fill="var(--ink)" class="${dim?'dim':''}"/>`;
    const on=act===p.id;
    s+=`<g class="cp-lane-l ${dim?'dim':''}" data-a="cp-path" data-id="${p.id}" tabindex="0" role="button" aria-label="Detail jalur ${p.id}"><rect x="${xA+14}" y="${ly-47}" width="${on?150:118}" height="19" rx="9.5" fill="${on?'var(--red)':'var(--canvas)'}" stroke="${CPGCOL[p.grp]}" stroke-width="1.2"/><text x="${xA+24}" y="${ly-34}" font-size="11" font-weight="800" fill="${on?'#fff':'var(--ink)'}">${p.id} · ${p.hops} hubungan${on?' · dipilih':''}</text></g>`;
  });
  const ly0=rows.filter(r=>r.p)[0].y, ly1=rows.filter(r=>r.p).slice(-1)[0].y;
  s+=`<line x1="${xA}" y1="${ly0}" x2="${xA}" y2="${ly1}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><line x1="${xB}" y1="${ly0}" x2="${xB}" y2="${ly1}" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>`;
  [[run.a,xA-38,'A'],[run.b,xB+38,'B']].forEach(([id,x,L])=>{ const t=NN[id].t, r=22, on=sel&&sel.t==='n'&&sel.id===id;
    s+=`<g class="nxn ${on?'sel':''}" data-a="cp-node" data-id="${id}" data-tip="${esc(cpName(id)+'|Objek '+L+' · '+skTL(t))}" tabindex="0" role="button" aria-label="${esc(cpName(id)+', objek '+L)}"><circle cx="${x}" cy="${cy}" r="${r+7}" fill="none" stroke="var(--ink)" stroke-width="2.5"/>${skShape(t,x,cy,r)}${skGlyph(t,x,cy,r)}<rect x="${x-10}" y="${cy-r-34}" width="20" height="20" rx="10" fill="var(--ink)"/><text x="${x}" y="${cy-r-20}" text-anchor="middle" fill="var(--paper)" font-size="12" font-weight="800">${L}</text><text x="${x}" y="${cy+r+20}" text-anchor="middle" class="nxl" style="font-size:12.5px">${esc(cpName(id))}</text><text x="${x}" y="${cy+r+33}" text-anchor="middle" class="nxs">${skTL(t)}</text></g>`; });
  return s+'</g></svg>';
}

const _cpNodePanel0 = cpNodePanel;
cpNodePanel = function(id,R,run){

ACT['cp-new']=()=>{ S.cp.form=cpNewForm(); S.cp.stage='list'; S.nx.mode='connect'; go('network'); setTimeout(()=>{ const i=document.querySelector('form[data-k="a"] input'); i&&i.focus(); },0); };
ACT['cp-home']=()=>{ S.cp.stage='list'; S.cp.busy=false; S.nx.mode='connect'; go('network'); };
ACT['cp-gen']=()=>{ const K=S.cp; if(K.busy) return; const F=K.form; if(!F.a.id||!F.b.id||F.a.id===F.b.id) return; K.busy=true; K.stage='gen'; const token=Date.now(); K.token=token; go('network');
  runProc('cp-proc',5,()=>{ if(K.stage!=='gen'||K.token!==token) return; K.busy=false; const r={id:'cp'+token, a:F.a.id, b:F.b.id, sc:{...CPDEF}, when:'Baru saja', status:'Lengkap', fresh:true}; K.runs.unshift(r); K.form=cpNewForm(); cpOpen(r.id); if(S.view==='network') go('network'); toast('Analisis Connection Paths siap.'); }); };
ACT['cp-cancel']=()=>{ S.cp.busy=false; S.cp.token=null; S.cp.stage='list'; rerender(); toast('Analisis dibatalkan. Pilihan objek tetap tersimpan.'); };

ACT['cp-swaprun']=()=>{ const K=S.cp, r=K.runs.find(x=>x.id===K.cur); let m=K.runs.find(x=>x.a===r.b&&x.b===r.a); if(!m){ m={id:'cp'+Date.now(), a:r.b, b:r.a, sc:{...CPDEF}, when:'Baru saja', status:'Lengkap', fresh:true}; K.runs.unshift(m); } cpOpen(m.id); rerender(); toast('Posisi A dan B ditukar. Arah hubungan menurut sumber tidak berubah.'); };
ACT['cp-path']=(el,d)=>{ const K=S.cp; K.act=d.id; K.note=null; K.sel = d.keep?{t:'n',id:d.keep}:null; rerender(); };

function rmAnalyse(run){
  const sc=run.sc, X=run.o, inP = e => sc.all || e.y0==null || ((e.y1??e.y0)>=sc.y0 && e.y0<=sc.y1);
  const E = rmEdges().filter(inP);
  const info=new Map([[X,{lv:0,p:null,e:[],kids:[]}]]); let fr=[X];
  for(let lv=1; lv<=sc.depth && fr.length; lv++){
    const nx=[];
    fr.forEach(id=>{ if(id!==X && NN[id].t==='Location') return; // lokasi bukan penghubung
      E.filter(e=>e.a===id||e.b===id).forEach(e=>{ const o=e.a===id?e.b:e.a; if(info.has(o)){ const v=info.get(o); if(v.p===id) v.e.push(e); return; } info.set(o,{lv,p:id,e:[e],kids:[]}); info.get(id).kids.push(o); nx.push(o); }); });
    fr=nx;
  }
  const alt={}; info.forEach((v,id)=>{ if(v.lv<2) return; alt[id]=[...info].filter(([pid,pv])=>pv.lv===v.lv-1&&pid!==v.p&&E.some(e=>(e.a===pid&&e.b===id)||(e.b===pid&&e.a===id))).map(([pid])=>pid); });
  const co = RM_COMENTION.filter(e=>e.a===X||e.b===X);
  return {X, sc, E, info, alt, co, total:info.size-1};
}
function rmPrio(R,id){ const v=R.info.get(id), e=v.e[0], t=NN[id].t, o=R.sc.obj, g=RMGRP[e.rel];

  if(o==='isu'&&(['Issue','Case'].includes(t)||['case','investigate','stance'].includes(g))) s+=3; if(o==='explore') s+=v.kids.length;

  const F=S.rm.f, X=R.X, keep=new Set([X]), pass=new Set();

  const anc = id => { let c=id; while(c&&c!==X){ if(hidden1.has(c)) return true; c=R.info.get(c).p; } return false; };
